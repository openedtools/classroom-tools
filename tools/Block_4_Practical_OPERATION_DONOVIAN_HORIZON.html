<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operation Northern Veil | Block 4 Capstone</title>
  <style>
    :root {
      --navy: #0a1628;
      --panel: #10233b;
      --panel2: #07101f;
      --olive: #5c6e2f;
      --green: #a0b265;
      --red: #b22222;
      --cream: #f5f1e8;
      --muted: #c9c0a9;
      --line: rgba(160, 178, 101, 0.55);
      --glass: rgba(245, 241, 232, 0.07);
      --glow: rgba(160, 178, 101, 0.38);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(160,178,101,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(160,178,101,.035) 1px, transparent 1px),
        radial-gradient(circle at 12% 8%, rgba(160,178,101,.13), transparent 23rem),
        radial-gradient(circle at 78% 0%, rgba(178,34,34,.10), transparent 20rem),
        var(--navy);
      background-size: 32px 32px;
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15.5pt;
      line-height: 1.42;
    }
    .banner {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: .18rem .42rem;
      background: #2f6f3a;
      color: var(--cream);
      text-align: center;
      font: 700 .66rem/1 "Courier New", monospace;
      letter-spacing: .08em;
    }
    .banner.bottom { position: fixed; top: auto; bottom: 0; left: 0; right: 0; }
    .shell {
      width: min(1280px, calc(100vw - 24px));
      margin: .65rem auto 2.55rem;
      border: 1px solid var(--line);
      background: rgba(10,22,40,.94);
      box-shadow: 0 28px 90px rgba(0,0,0,.38);
      min-height: calc(100vh - 7rem);
    }
    header {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: .75rem;
      align-items: center;
      padding: .75rem 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(16,35,59,.96);
      backdrop-filter: blur(8px);
      font-family: "Courier New", monospace;
      text-transform: uppercase;
      font-size: .76rem;
    }
    .score {
      min-width: 8rem;
      border: 1px solid var(--line);
      color: var(--green);
      padding: .28rem .55rem;
      text-align: center;
    }
    .score.flash { background: var(--green); color: var(--navy); }
    .hamburger {
      min-width: 48px;
      min-height: 42px;
      padding: .25rem .45rem;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--cream);
      font-size: 1.2rem;
    }
    .help-btn {
      min-height: 42px;
      padding: .25rem .7rem;
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--cream);
      font-size: .78rem;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      min-height: calc(100vh - 8rem);
    }
    main { padding: clamp(.75rem, 1.7vw, 1.15rem); }
    aside {
      border-left: 1px solid var(--line);
      background: rgba(7,16,31,.72);
      padding: .8rem;
      overflow: auto;
    }
    aside.collapsed { display: none; }
    h1, h2, h3 {
      font-family: "Courier New", monospace;
      letter-spacing: 0;
      line-height: 1.08;
      margin: 0 0 1rem;
    }
    h1 { font-size: clamp(1.85rem, 4vw, 3.2rem); }
    h2 { font-size: clamp(1.28rem, 2.8vw, 1.9rem); }
    h3 { font-size: .96rem; color: var(--green); }
    p { margin: 0 0 .85rem; }
    .kicker {
      color: var(--green);
      font: 700 .82rem/1.1 "Courier New", monospace;
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: .65rem;
    }
    .panel, .card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(245,241,232,.08), rgba(16,35,59,.72));
      padding: .68rem;
      margin: .65rem 0;
      box-shadow: inset 0 1px 0 rgba(245,241,232,.06);
    }
    .scenario-panel {
      border: 1px solid rgba(160,178,101,.4);
      background: rgba(7,16,31,.58);
      padding: .75rem;
      margin: .7rem 0;
    }
    .scenario-panel h3 {
      margin-bottom: .45rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .scenario-grid {
      display: grid;
      gap: .5rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .scenario-chip {
      border: 1px solid rgba(160,178,101,.28);
      background: rgba(16,35,59,.66);
      padding: .5rem .58rem;
      font-size: .78rem;
      color: var(--muted);
    }
    .scenario-chip strong {
      display: block;
      color: var(--green);
      font-family: "Courier New", monospace;
      margin-bottom: .2rem;
      text-transform: uppercase;
      font-size: .72rem;
    }
    .intro-grid {
      display: grid;
      grid-template-columns: minmax(280px, 1.25fr) minmax(240px, .95fr);
      gap: .85rem;
      align-items: start;
    }
    .intro-map {
      width: 100%;
      display: block;
      border: 1px solid var(--line);
      background: var(--panel2);
      margin: 0 0 .75rem;
    }
    .visual-placeholder {
      border: 1px solid rgba(160,178,101,.35);
      background: rgba(7,16,31,.66);
      padding: .7rem;
      margin: .7rem 0;
    }
    .visual-placeholder strong {
      display: block;
      color: var(--green);
      font-family: "Courier New", monospace;
      text-transform: uppercase;
      font-size: .72rem;
      margin-bottom: .35rem;
    }
    .visual-placeholder p {
      margin: 0;
      color: var(--muted);
      font-size: .86rem;
    }
    .brief-section {
      border: 1px solid rgba(160,178,101,.32);
      padding: .55rem;
      margin-bottom: .55rem;
      background: rgba(16,35,59,.45);
      font-size: .72rem;
      transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }
    .brief-section.active {
      border-color: var(--green);
      background: rgba(160,178,101,.12);
      box-shadow: 0 0 0 1px rgba(160,178,101,.22), 0 0 24px var(--glow);
      animation: activeBriefPulse 2.4s ease-in-out infinite;
    }
    @keyframes activeBriefPulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(160,178,101,.2), 0 0 16px rgba(160,178,101,.26); }
      50% { box-shadow: 0 0 0 1px rgba(160,178,101,.55), 0 0 34px rgba(160,178,101,.55); }
    }
    .brief-section h4 {
      margin: 0 0 .35rem;
      color: var(--green);
      font-family: "Courier New", monospace;
      text-transform: uppercase;
      font-size: .72rem;
    }
    .brief-section p { margin: 0; color: var(--muted); }
    .skipped { color: #9c9c9c; font-style: italic; }
    button, textarea, input {
      font: inherit;
    }
    button {
      min-height: 46px;
      border: 1px solid rgba(245,241,232,.16);
      background: var(--olive);
      color: var(--cream);
      padding: .48rem .68rem;
      font-family: "Courier New", monospace;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
    }
    .icon-button {
      width: auto;
      min-width: 46px;
      padding: .45rem .7rem;
    }
    button:hover:not(:disabled), button:focus-visible:not(:disabled) {
      background: var(--green);
      color: var(--navy);
      outline: none;
    }
    button:disabled { opacity: .35; cursor: not-allowed; }
    .button-row { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: .9rem; }
    .button-row button { flex: 1 1 210px; }
    input, textarea {
      width: 100%;
      min-height: 54px;
      background: var(--panel2);
      color: var(--cream);
      border: 1px solid var(--line);
      padding: .65rem;
    }
    textarea { min-height: 140px; resize: vertical; }
    .options, .match-grid, .class-list { display: grid; gap: .65rem; margin: .8rem 0; }
    .option, .match-item, .match-cat, .seq-item, .class-choice {
      width: 100%;
      text-align: left;
      background: rgba(16,35,59,.94);
      border-color: var(--line);
      text-transform: none;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
    }
    .option.selected, .match-item.selected, .match-cat.selected, .seq-item.selected, .class-choice.selected {
      background: var(--green);
      color: var(--navy);
    }
    .correct { border-color: var(--green) !important; background: rgba(160,178,101,.22) !important; color: var(--green) !important; }
    .incorrect { border-color: var(--red) !important; background: rgba(178,34,34,.18) !important; }
    .reveal-correct { border-color: var(--green) !important; opacity: .55; }
    .hotspot.correct { fill: rgba(160,178,101,.45) !important; stroke: var(--green) !important; stroke-width: 3; }
    .hotspot.incorrect { fill: rgba(178,34,34,.38) !important; stroke: var(--red) !important; stroke-width: 3; }
    .match-grid { grid-template-columns: 1fr 1fr; }
    .assignment { font-size: .72rem; color: var(--muted); margin-top: .3rem; }
    .sequence-slots {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: .5rem;
      margin: .75rem 0;
    }
    .slot {
      border: 1px dashed var(--line);
      min-height: 48px;
      padding: .35rem;
      color: var(--muted);
      font-size: .78rem;
    }
    .sequence-bank, .drag-bank {
      display: grid;
      gap: .5rem;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      margin: .75rem 0;
    }
    .sequence-bank .seq-item, .drag-pill {
      cursor: grab;
      user-select: none;
    }
    .sequence-bank .seq-item.dragging, .drag-pill.dragging {
      opacity: .45;
    }
    .drop-slot {
      border: 1px dashed var(--line);
      min-height: 54px;
      padding: .45rem;
      background: rgba(7,16,31,.42);
      color: var(--muted);
    }
    .drop-slot.over {
      border-color: var(--green);
      background: rgba(160,178,101,.08);
    }
    .drop-slot.filled {
      color: var(--cream);
      border-style: solid;
    }
    .drag-pill {
      width: 100%;
      background: rgba(16,35,59,.94);
      border: 1px solid var(--line);
      padding: .55rem .6rem;
      text-transform: none;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      min-height: 54px;
    }
    .svg-wrap {
      border: 1px solid var(--line);
      background: rgba(7,16,31,.72);
      padding: .6rem;
      margin: .8rem 0;
      display: grid;
      place-items: center;
    }
    .phase-image {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border: 1px solid var(--line);
      display: block;
      margin: .85rem 0;
      background: var(--panel2);
    }
    .activity-image {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      border: 1px solid var(--line);
      background: var(--panel2);
      display: block;
      margin: .65rem 0;
    }
    .review-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: .55rem;
      margin-top: .6rem;
    }
    .review-chip {
      border: 1px solid rgba(160,178,101,.35);
      background: rgba(7,16,31,.55);
      padding: .55rem;
      font-size: .78rem;
      color: var(--muted);
    }
    .review-right { color: var(--green); font-weight: 700; margin-bottom: .2rem; }
    .review-wrong { color: #ff9c9c; font-weight: 700; margin-bottom: .2rem; }
    .sentence-frame {
      border-left: 4px solid var(--green);
      padding: .6rem .75rem;
      margin: .75rem 0;
      background: rgba(160,178,101,.10);
      color: var(--cream);
      font-size: .86rem;
    }
    svg { max-width: 100%; height: auto; }
    .hotspot { cursor: pointer; fill: rgba(160,178,101,.05); stroke: rgba(160,178,101,.2); stroke-width: 2; }
    .hotspot.selected { fill: rgba(160,178,101,.38); stroke: var(--green); }
    .class-row {
      border: 1px solid var(--line);
      padding: .7rem;
      background: rgba(7,16,31,.46);
    }
    .class-options {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin-top: .45rem;
    }
    .class-choice {
      width: auto;
      min-height: 44px;
      padding: .4rem .55rem;
      font-size: .78rem;
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: .65rem;
    }
    .action-row button {
      flex: 1 1 160px;
      min-height: 42px;
      font-size: .74rem;
    }
    .feedback-panel {
      border: 1px solid var(--line);
      background: rgba(7,16,31,.66);
      padding: .72rem;
      margin-top: .75rem;
    }
    .feedback-panel.good { border-color: rgba(160,178,101,.5); }
    .feedback-panel.bad { border-color: rgba(178,34,34,.5); }
    .rubric-grid {
      display: grid;
      gap: .45rem;
      margin-top: .55rem;
    }
    .rubric-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: .45rem;
      align-items: start;
      border: 1px solid rgba(160,178,101,.22);
      background: rgba(16,35,59,.58);
      padding: .5rem .55rem;
      font-size: .78rem;
    }
    .rubric-row strong {
      display: block;
      color: var(--green);
      margin-bottom: .15rem;
    }
    .rubric-score {
      color: var(--cream);
      font-family: "Courier New", monospace;
      white-space: nowrap;
    }
    .menu {
      position: fixed;
      right: 1rem;
      top: 4.7rem;
      width: min(320px, calc(100vw - 2rem));
      background: var(--panel);
      border: 1px solid var(--line);
      padding: .75rem;
      z-index: 50;
      box-shadow: 0 18px 60px rgba(0,0,0,.4);
    }
    .menu.hidden, .hidden { display: none; }
    .menu button { width: 100%; margin: .25rem 0; min-height: 46px; }
    .pause {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 70;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .pause.hidden { display: none; }
    .pause .panel { max-width: 560px; background: var(--panel); }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0,0,0,.72);
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .modal.hidden { display: none; }
    .modal-card {
      width: min(880px, calc(100vw - 2rem));
      max-height: min(82vh, 820px);
      overflow: auto;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #142a47, #07101f);
      padding: 1rem;
      box-shadow: 0 30px 100px rgba(0,0,0,.55);
    }
    .term-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: .55rem;
    }
    .term-card {
      border: 1px solid rgba(160,178,101,.35);
      background: rgba(245,241,232,.06);
      padding: .65rem;
      font-size: .78rem;
    }
    .term-card strong {
      display: block;
      color: var(--green);
      font-family: "Courier New", monospace;
      margin-bottom: .25rem;
    }
    .result-score {
      font: 700 clamp(3rem, 12vw, 6.5rem)/1 "Courier New", monospace;
      color: var(--green);
    }
    .copy-status { color: var(--green); font-size: .82rem; }
    .phase-bar {
      display: flex;
      gap: .28rem;
      padding: .3rem .75rem;
      border-bottom: 1px solid var(--line);
      background: rgba(7,16,31,.42);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .phase-bar::-webkit-scrollbar { display: none; }
    .phase-pip {
      display: inline-flex;
      align-items: center;
      padding: .18rem .42rem;
      border: 1px solid rgba(160,178,101,.18);
      font: 600 .63rem/1 "Courier New", monospace;
      color: var(--muted);
      white-space: nowrap;
      text-transform: uppercase;
      flex-shrink: 0;
      letter-spacing: .02em;
    }
    .phase-pip.done { border-color: rgba(160,178,101,.4); color: rgba(160,178,101,.6); }
    .phase-pip.current { border-color: var(--green); color: var(--green); background: rgba(160,178,101,.11); }
    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .layout { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
    }
    @media print {
      body { background: white; color: black; font-size: 12pt; }
      .banner, header, aside, .button-row, .menu, .pause, .modal { display: none !important; }
      .shell { border: 0; margin: 0; width: 100%; background: white; }
      .layout { display: block; }
      main { padding: 0; }
      .panel, .card { border: 1px solid #333; background: white; color: black; }
      h1, h2, h3 { color: black; }
    }

  </style>
</head>
<body>
  <div class="banner">UNCLASSIFIED // FOR TRAINING USE ONLY</div>
  <div class="shell">
    <header>
      <div id="headTitle">JTF CORAL SHIELD // OPERATION DONOVIAN HORIZON</div>
      <div id="teamLine">Team: Not Assigned</div>
      <div style="display:flex;gap:.5rem;align-items:center;justify-content:flex-end">
        <button id="backBtn" class="help-btn" type="button">Back</button>
        <div id="scoreLine" class="score">Score: 0</div>
        <button id="helpBtn" class="help-btn" type="button">Help</button>
        <button id="sourcesBtn" class="help-btn" type="button">Sources</button>
        <button id="menuBtn" class="hamburger" type="button">MENU</button>
      </div>
    </header>
    <div id="phaseBar" class="phase-bar hidden"></div>
    <div class="layout">
      <main id="app"></main>
      <aside id="briefAside"></aside>
    </div>
  </div>
  <div id="menu" class="menu hidden">
    <button id="pauseBtn">Pause</button>
    <button id="skipActivityBtn">Skip Activity</button>
    <button id="skipPhaseBtn">Skip Phase</button>
    <button id="restartPhaseBtn">Restart Phase</button>
    <button id="saveBtn">Save Progress</button>
    <button id="resumeBtn">Resume Saved</button>
    <button id="quitBtn">Quit to Intro</button>
  </div>
  <div id="pauseOverlay" class="pause hidden">
    <div class="panel">
      <h2>Mission Paused</h2>
      <p>Mission flow is paused. Resume when the team is ready.</p>
      <button id="resumePauseBtn">Resume Mission</button>
    </div>
  </div>
  <div id="helpModal" class="modal hidden">
    <div class="modal-card">
      <div class="button-row" style="margin-top:0">
        <button id="lessonHelpTab">Lesson Help</button>
        <button id="glossaryTab">Definition Log</button>
        <button id="sourcesTab">Sources</button>
        <button id="closeHelpBtn">Close</button>
      </div>
      <div id="helpContent"></div>
    </div>
  </div>
  <div class="banner bottom">UNCLASSIFIED // FOR TRAINING USE ONLY</div>

  <script>
    const BRIEF_SECTIONS = [
      "SCENARIO BASELINE",
      "INFORMATION SHAPING",
      "CYBER DISRUPTION",
      "BORDER / GEOINT",
      "EMS / IR THREATS",
      "SPACE / ISR ANGLE"
    ];

    const LESSON_HELP = {
      1: {
        title: "Scenario Baseline",
        bullets: [
          "Gorgas is the partner nation at the center of the exercise, and Donovia is the tense neighbor applying pressure.",
          "Zabzimek is the flashpoint district where the border story, cyber activity, and influence activity all converge.",
          "The opening picture is intentionally ambiguous because the first clues do not yet prove intent.",
          "The J-2 must separate the 5Ws from the noise before jumping to a conclusion."
        ],
        sentence: "Suggested brief shape: Donovia and Gorgas are contesting Zabzimek, and the opening picture is ambiguous enough that the J-2 still needs collection before intent is clear."
      },
      2: {
        title: "Information Shaping",
        bullets: [
          "The Information Environment has physical, informational, and cognitive dimensions.",
          "Disinformation is false information spread deliberately to deceive.",
          "Misinformation is false information shared without intent to deceive.",
          "Malinformation is true information used to cause harm.",
          "The J-2 supports IO by identifying adversary vulnerabilities in the IE."
        ],
        sentence: "Suggested brief shape: Donovian influence activity is deliberate disinformation aimed at shaping what audiences believe about Zabzimek."
      },
      3: {
        title: "Cyber Disruption",
        bullets: [
          "Nation-state cyber actors are usually patient, resourced, and politically motivated.",
          "Cyber kill chain order: Reconnaissance, Weaponization/Delivery, Exploitation/Installation, Command and Control, Actions on Objectives.",
          "A cyber threat attacks networks, systems, or data.",
          "A cyber-enabled threat uses cyberspace to do something else, such as influence.",
          "Network defense and counter-messaging are different response tracks."
        ],
        sentence: "Suggested brief shape: SCARLET MAMBA is the cyber threat against the network, while the rumor campaign is cyber-enabled influence and needs a separate response."
      },
      4: {
        title: "Border / GEOINT",
        bullets: [
          "GEOINT uses imagery, imagery intelligence, and geospatial information to describe activity in space and time.",
          "MTI detects movement across a wide area.",
          "FMV watches a smaller area continuously.",
          "WAMI gives wide-area coverage and forensic look-back.",
          "GEOINT can show activity around a building or route, but not inside solid structures."
        ],
        sentence: "Suggested brief shape: Donovian ground movement is building near Zabzimek and GEOINT can confirm the route, staging, and pattern of life around the flashpoint."
      },
      5: {
        title: "EMS / IR Threats",
        bullets: [
          "Lower frequency means longer wavelength and generally longer range.",
          "Higher frequency means shorter wavelength and usually better detail.",
          "Terrain blocks line of sight for radar and SIGINT collection.",
          "IR systems detect heat signatures, especially engine exhaust and launch plumes.",
          "Flares help against many IR seekers, but IIR seekers may require maneuver plus other tactics."
        ],
        sentence: "Suggested brief shape: The radar picture suggests an imminent threat, and the IR picture means the pilot must treat hot engine exhaust and IIR seekers as the primary danger."
      },
      6: {
        title: "Space / ISR Angle",
        bullets: [
          "GEO satellites appear fixed over one point on the equator.",
          "LEO supports high resolution and short revisit.",

          },

            note: actionable ? "The answer tells the J-2 what to do with the information." : "Add a recommendation, warning, or assessment sentence."
          },
          {
            label: "Clear writing",
            score: clarity ? 5 : 0,
            note: clarity ? "The answer is long enough to brief and can be tightened later." : "Write at least one complete sentence so the brief can stand on its own."
          }

        const missing = [];
        if (!anchored) missing.push("phase scenario");
        if (!conceptScore) missing.push("lesson terms");
        if (!actionable) missing.push("a recommendation or assessment");

        return {
          total,
          rows,
          reviews: rowData.map(row => ({

            verdict: row.score > 0 ? "Right" : "Wrong",

          summary: total >= 15 ? "Good brief contribution." : `Missing ${missing.join(", ")}.`,

    }
    function renderResults() {
      localStorage.removeItem("northernVeilSave");
      render(`
        <div class="kicker">Final Results</div>
        <h2>${esc(state.team)}</h2>
        <div class="result-score">${state.score}</div>
        <div class="panel"><h3>${scoreTitle()}</h3><p>Total possible: ${totalPossible()}</p><p>Write your team name and final score on the leaderboard. Hand your brief to the instructor.</p></div>
        <div class="button-row"><button id="downloadFinalBtn">Download Brief / Assessment</button><button id="restartBtn">Restart Exercise</button></div>
      `);
      document.getElementById("downloadFinalBtn").onclick = downloadAssessment;
      document.getElementById("restartBtn").onclick = resetAll;
    }
    function resetAll() {
      Object.assign(state, { team:"", screen:"intro", phaseIndex:0, activityKey:"intro", score:0, brief:Object.fromEntries(BRIEF_SECTIONS.map(s=>[s,""])), skipped:{}, paused:false, currentResult:null, activityLog:{}, history:[], capstone:{mlcoa:[], mdcoa:[], indicator:""} });
      renderIntro();
    }
    document.getElementById("menuBtn").onclick = () => menu.classList.toggle("hidden");
    document.getElementById("backBtn").onclick = goBack;
    document.getElementById("helpBtn").onclick = () => showHelp("lesson");
    document.getElementById("sourcesBtn").onclick = () => showHelp("sources");
    document.getElementById("lessonHelpTab").onclick = () => showHelp("lesson");
    document.getElementById("glossaryTab").onclick = () => showHelp("glossary");
    document.getElementById("sourcesTab").onclick = () => showHelp("sources");
    document.getElementById("closeHelpBtn").onclick = () => helpModal.classList.add("hidden");
    helpModal.addEventListener("click", event => {
      if (event.target === helpModal) helpModal.classList.add("hidden");
    });
    document.getElementById("pauseBtn").onclick = () => { state.paused = true; pauseOverlay.classList.remove("hidden"); menu.classList.add("hidden"); };
    document.getElementById("resumePauseBtn").onclick = () => { state.paused = false; pauseOverlay.classList.add("hidden"); };
    document.getElementById("skipActivityBtn").onclick = skipActivity;
    document.getElementById("skipPhaseBtn").onclick = () => { if (confirm("Skip this phase? Its brief section will be marked skipped.")) skipPhase(); };
    document.getElementById("restartPhaseBtn").onclick = () => { if (confirm("Restart current phase? Current phase work will be reset.")) restartPhase(); };
    document.getElementById("quitBtn").onclick = () => { if (confirm("Quit to intro and lose current progress?")) resetAll(); };
document.getElementById("saveBtn").onclick = () => { localStorage.setItem("northernVeilSave", JSON.stringify(state)); menu.classList.add("hidden"); };
    document.getElementById("resumeBtn").onclick = () => {
      const saved = localStorage.getItem("northernVeilSave");
      if (!saved) return alert("No saved progress found.");
      Object.assign(state, JSON.parse(saved));
      if (state.phaseIndex >= PHASES.length) renderCapstoneReview(); else if (state.activityKey === "A" || state.activityKey === "B" || state.activityKey === "C") renderActivity(state.activityKey); else renderIntelUpdate();
    };
    renderIntro();
  </script>
</body>
</html>
