<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operation Donovian Horizon | Block 4 Capstone</title>
  <style>
    :root {
      --navy: #0a1628;
      --panel: #10233b;
      --panel2: #07101f;
      --olive: #5c6e2f;
      --green: #a0b265;
      --red: #b22222;
      --cream: #f5f1e8;
      --muted: #c9c0a9;
      --line: rgba(160, 178, 101, 0.55);
      --glass: rgba(245, 241, 232, 0.07);
      --glow: rgba(160, 178, 101, 0.38);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(160,178,101,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(160,178,101,.035) 1px, transparent 1px),
        radial-gradient(circle at 12% 8%, rgba(160,178,101,.13), transparent 23rem),
        radial-gradient(circle at 78% 0%, rgba(178,34,34,.10), transparent 20rem),
        var(--navy);
      background-size: 32px 32px;
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18pt;
      line-height: 1.42;
    }
    .banner {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: .42rem;
      background: #2f6f3a;
      color: var(--cream);
      text-align: center;
      font: 700 .82rem/1.1 "Courier New", monospace;
      letter-spacing: .08em;
    }
    .banner.bottom { position: fixed; top: auto; bottom: 0; left: 0; right: 0; }
    .shell {
      width: min(1280px, calc(100vw - 24px));
      margin: 1rem auto 3.6rem;
      border: 1px solid var(--line);
      background: rgba(10,22,40,.94);
      box-shadow: 0 28px 90px rgba(0,0,0,.38);
      min-height: calc(100vh - 7rem);
    }
    header {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: .75rem;
      align-items: center;
      padding: .75rem 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(16,35,59,.96);
      backdrop-filter: blur(8px);
      font-family: "Courier New", monospace;
      text-transform: uppercase;
      font-size: .76rem;
    }
    .score {
      min-width: 8rem;
      border: 1px solid var(--line);
      color: var(--green);
      padding: .28rem .55rem;
      text-align: center;
    }
    .score.flash { background: var(--green); color: var(--navy); }
    .hamburger {
      min-width: 48px;
      min-height: 42px;
      padding: .25rem .45rem;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--cream);
      font-size: 1.2rem;
    }
    .help-btn {
      min-height: 42px;
      padding: .25rem .7rem;
      background: var(--glass);
      border: 1px solid var(--line);
      color: var(--cream);
      font-size: .78rem;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      min-height: calc(100vh - 11rem);
    }
    main { padding: clamp(1rem, 2.4vw, 1.6rem); }
    aside {
      border-left: 1px solid var(--line);
      background: rgba(7,16,31,.72);
      padding: .8rem;
      overflow: auto;
    }
    aside.collapsed { display: none; }
    h1, h2, h3 {
      font-family: "Courier New", monospace;
      letter-spacing: 0;
      line-height: 1.08;
      margin: 0 0 1rem;
    }
    h1 { font-size: clamp(2.2rem, 5vw, 4rem); }
    h2 { font-size: clamp(1.55rem, 3.4vw, 2.4rem); }
    h3 { font-size: 1.08rem; color: var(--green); }
    p { margin: 0 0 .85rem; }
    .kicker {
      color: var(--green);
      font: 700 .82rem/1.1 "Courier New", monospace;
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: .65rem;
    }
    .panel, .card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(245,241,232,.08), rgba(16,35,59,.72));
      padding: .85rem;
      margin: .85rem 0;
      box-shadow: inset 0 1px 0 rgba(245,241,232,.06);
    }
    .brief-section {
      border: 1px solid rgba(160,178,101,.32);
      padding: .55rem;
      margin-bottom: .55rem;
      background: rgba(16,35,59,.45);
      font-size: .72rem;
      transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }
    .brief-section.active {
      border-color: var(--green);
      background: rgba(160,178,101,.12);
      box-shadow: 0 0 0 1px rgba(160,178,101,.22), 0 0 24px var(--glow);
      animation: activeBriefPulse 2.4s ease-in-out infinite;
    }
    @keyframes activeBriefPulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(160,178,101,.2), 0 0 16px rgba(160,178,101,.26); }
      50% { box-shadow: 0 0 0 1px rgba(160,178,101,.55), 0 0 34px rgba(160,178,101,.55); }
    }
    .brief-section h4 {
      margin: 0 0 .35rem;
      color: var(--green);
      font-family: "Courier New", monospace;
      text-transform: uppercase;
      font-size: .72rem;
    }
    .brief-section p { margin: 0; color: var(--muted); }
    .skipped { color: #9c9c9c; font-style: italic; }
    button, textarea, input {
      font: inherit;
    }
    button {
      min-height: 56px;
      border: 1px solid rgba(245,241,232,.16);
      background: var(--olive);
      color: var(--cream);
      padding: .62rem .85rem;
      font-family: "Courier New", monospace;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
    }
    button:hover:not(:disabled), button:focus-visible:not(:disabled) {
      background: var(--green);
      color: var(--navy);
      outline: none;
    }
    button:disabled { opacity: .35; cursor: not-allowed; }
    .button-row { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: .9rem; }
    .button-row button { flex: 1 1 210px; }
    input, textarea {
      width: 100%;
      min-height: 54px;
      background: var(--panel2);
      color: var(--cream);
      border: 1px solid var(--line);
      padding: .65rem;
    }
    textarea { min-height: 140px; resize: vertical; }
    .timer {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      border: 1px solid var(--line);
      padding: .35rem .55rem;
      margin-bottom: .75rem;
      color: var(--muted);
      font: 700 .78rem/1 "Courier New", monospace;
      text-transform: uppercase;
    }
    .options, .match-grid, .class-list { display: grid; gap: .65rem; margin: .8rem 0; }
    .option, .match-item, .match-cat, .seq-item, .class-choice {
      width: 100%;
      text-align: left;
      background: rgba(16,35,59,.94);
      border-color: var(--line);
      text-transform: none;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
    }
    .option.selected, .match-item.selected, .match-cat.selected, .seq-item.selected, .class-choice.selected {
      background: var(--green);
      color: var(--navy);
    }
    .correct { border-color: var(--green) !important; }
    .incorrect { border-color: var(--red) !important; }
    .match-grid { grid-template-columns: 1fr 1fr; }
    .assignment { font-size: .72rem; color: var(--muted); margin-top: .3rem; }
    .sequence-slots {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: .5rem;
      margin: .75rem 0;
    }
    .slot {
      border: 1px dashed var(--line);
      min-height: 48px;
      padding: .35rem;
      color: var(--muted);
      font-size: .78rem;
    }
    .svg-wrap {
      border: 1px solid var(--line);
      background: rgba(7,16,31,.72);
      padding: .6rem;
      margin: .8rem 0;
      display: grid;
      place-items: center;
    }
    .phase-image {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border: 1px solid var(--line);
      display: block;
      margin: .85rem 0;
      background: var(--panel2);
    }
    .review-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: .55rem;
      margin-top: .6rem;
    }
    .review-chip {
      border: 1px solid rgba(160,178,101,.35);
      background: rgba(7,16,31,.55);
      padding: .55rem;
      font-size: .78rem;
      color: var(--muted);
    }
    .sentence-frame {
      border-left: 4px solid var(--green);
      padding: .6rem .75rem;
      margin: .75rem 0;
      background: rgba(160,178,101,.10);
      color: var(--cream);
      font-size: .86rem;
    }
    svg { max-width: 100%; height: auto; }
    .hotspot { cursor: pointer; fill: rgba(160,178,101,.05); stroke: rgba(160,178,101,.2); stroke-width: 2; }
    .hotspot.selected { fill: rgba(160,178,101,.38); stroke: var(--green); }
    .class-row {
      border: 1px solid var(--line);
      padding: .7rem;
      background: rgba(7,16,31,.46);
    }
    .class-options {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin-top: .45rem;
    }
    .class-choice {
      width: auto;
      min-height: 44px;
      padding: .4rem .55rem;
      font-size: .78rem;
    }
    .menu {
      position: fixed;
      right: 1rem;
      top: 4.7rem;
      width: min(320px, calc(100vw - 2rem));
      background: var(--panel);
      border: 1px solid var(--line);
      padding: .75rem;
      z-index: 50;
      box-shadow: 0 18px 60px rgba(0,0,0,.4);
    }
    .menu.hidden, .hidden { display: none; }
    .menu button { width: 100%; margin: .25rem 0; min-height: 46px; }
    .pause {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      z-index: 70;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .pause.hidden { display: none; }
    .pause .panel { max-width: 560px; background: var(--panel); }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0,0,0,.72);
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .modal.hidden { display: none; }
    .modal-card {
      width: min(880px, calc(100vw - 2rem));
      max-height: min(82vh, 820px);
      overflow: auto;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #142a47, #07101f);
      padding: 1rem;
      box-shadow: 0 30px 100px rgba(0,0,0,.55);
    }
    .term-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: .55rem;
    }
    .term-card {
      border: 1px solid rgba(160,178,101,.35);
      background: rgba(245,241,232,.06);
      padding: .65rem;
      font-size: .78rem;
    }
    .term-card strong {
      display: block;
      color: var(--green);
      font-family: "Courier New", monospace;
      margin-bottom: .25rem;
    }
    .result-score {
      font: 700 clamp(3rem, 12vw, 6.5rem)/1 "Courier New", monospace;
      color: var(--green);
    }
    .copy-status { color: var(--green); font-size: .82rem; }
    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      .layout { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
    }
    @media print {
      body { background: white; color: black; font-size: 12pt; }
      .banner, header, aside, .button-row, .menu, .pause, .modal, .timer { display: none !important; }
      .shell { border: 0; margin: 0; width: 100%; background: white; }
      .layout { display: block; }
      main { padding: 0; }
      .panel, .card { border: 1px solid #333; background: white; color: black; }
      h1, h2, h3 { color: black; }
    }
  </style>
</head>
<body>
  <div class="banner">UNCLASSIFIED // FOR TRAINING USE ONLY</div>
  <div class="shell">
    <header>
      <div id="headTitle">JTF CORAL SHIELD // OPERATION DONOVIAN HORIZON</div>
      <div id="teamLine">Team: Not Assigned</div>
      <div style="display:flex;gap:.5rem;align-items:center;justify-content:flex-end">
        <div id="scoreLine" class="score">Score: 0</div>
        <button id="helpBtn" class="help-btn" type="button">Help</button>
        <button id="sourcesBtn" class="help-btn" type="button">Sources</button>
        <button id="menuBtn" class="hamburger" type="button">MENU</button>
      </div>
    </header>
    <div class="layout">
      <main id="app"></main>
      <aside id="briefAside"></aside>
    </div>
  </div>
  <div id="menu" class="menu hidden">
    <button id="pauseBtn">Pause</button>
    <button id="skipActivityBtn">Skip Activity</button>
    <button id="skipPhaseBtn">Skip Phase</button>
    <button id="restartPhaseBtn">Restart Phase</button>
    <button id="toggleLockBtn">Instructor Lock: Off</button>
    <button id="saveBtn">Save Progress</button>
    <button id="resumeBtn">Resume Saved</button>
    <button id="quitBtn">Quit to Intro</button>
  </div>
  <div id="pauseOverlay" class="pause hidden">
    <div class="panel">
      <h2>Mission Paused</h2>
      <p>Timers are paused. Resume when the team is ready.</p>
      <button id="resumePauseBtn">Resume Mission</button>
    </div>
  </div>
  <div id="helpModal" class="modal hidden">
    <div class="modal-card">
      <div class="button-row" style="margin-top:0">
        <button id="lessonHelpTab">Lesson Help</button>
        <button id="glossaryTab">Definition Log</button>
        <button id="sourcesTab">Sources</button>
        <button id="closeHelpBtn">Close</button>
      </div>
      <div id="helpContent"></div>
    </div>
  </div>
  <div class="banner bottom">UNCLASSIFIED // FOR TRAINING USE ONLY</div>

  <script>
    const BRIEF_SECTIONS = [
      "GEOINT ASSESSMENT",
      "EM / SIGINT POSTURE",
      "RADAR & AIR THREATS",
      "AIR SURVIVAL POSTURE",
      "CYBER POSTURE",
      "INFLUENCE / IO",
      "ISR PLAN",
      "SPACE ASSESSMENT"
    ];

    const LESSON_HELP = {
      1: {
        title: "GEOINT Review",
        bullets: [
          "GEOINT uses imagery, imagery intelligence, and geospatial information to describe activity in space and time.",
          "MTI detects moving targets over wide areas.",
          "FMV is continuous video of a smaller area.",
          "WAMI covers a large area and supports forensic look-back.",
          "GEOINT cannot see through solid structures. It can show activity around a building."
        ],
        sentence: "Suggested brief shape: Donovian forces are [moving/deploying] toward [coast/port] with [brigade/vehicle column/number] indicators."
      },
      2: {
        title: "Electromagnetic Theory Review",
        bullets: [
          "Lower frequency means longer wavelength and generally longer range.",
          "Higher frequency means shorter wavelength and usually better detail.",
          "Terrain blocks line of sight for many radar and SIGINT-relevant signals.",
          "A collector site must have usable line of sight to the emitter.",
          "ELINT focuses on non-communications electromagnetic signals such as radar."
        ],
        sentence: "Suggested brief shape: Recommend Site B because it has [line of sight] and the other sites are [terrain-shadowed/blocked]."
      },
      3: {
        title: "Radar and Kill Chain Review",
        bullets: [
          "An IADS is a system of systems. Each radar has a job.",
          "Early warning finds targets at long range.",
          "Acquisition radars fix the target location more precisely.",
          "Fire-control radars support tracking, targeting, and engagement.",
          "Kill chain order: Find, Fix, Track, Target, Engage, Assess."
        ],
        sentence: "Suggested brief shape: Donovian IADS is in [Track/Target] because [STEEL CLAW is locked], which means [imminent engagement threat]."
      },
      4: {
        title: "Infrared Threats Review",
        bullets: [
          "IR systems detect heat signatures.",
          "Hot engine exhaust is a major aircraft vulnerability.",
          "Flares are used against many IR-guided missiles.",
          "Chaff and radar jamming are for radar-guided threats, not IR threats.",
          "IIR seekers form an image and may reject simple flares."
        ],
        sentence: "Suggested brief shape: IR SAM threat confirmed. Pilot should use [flares] and [maneuver] for IIR or advanced seekers."
      },
      5: {
        title: "Cyber Intelligence Review",
        bullets: [
          "Nation-state actors are resourced, patient, and politically motivated.",
          "Cyber kill chain order: Reconnaissance, Weaponization/Delivery, Exploitation/Installation, Command and Control, Actions on Objectives.",
          "A cyber threat attacks networks, systems, or data.",
          "A cyber-enabled threat uses cyberspace to do something else, such as influence.",
          "Network defense and counter-messaging are different response tracks."
        ],
        sentence: "Suggested brief shape: SCARLET MAMBA is a [nation-state/cyber threat], while disinformation is [cyber-enabled influence]."
      },
      6: {
        title: "Information Operations Review",
        bullets: [
          "The Information Environment has physical, informational, and cognitive dimensions.",
          "Disinformation is false information spread deliberately to deceive.",
          "Misinformation is false information shared without intent to deceive.",
          "Malinformation is true information used to cause harm.",
          "J-2 supports IO by identifying adversary vulnerabilities in the IE."
        ],
        sentence: "Suggested brief shape: J-2 should [identify/analyze] Donovian IE vulnerabilities such as [fabricated imagery/bot fingerprints]."
      },
      7: {
        title: "ISR Fundamentals Review",
        bullets: [
          "ISR means Intelligence, Surveillance, and Reconnaissance.",
          "A PIR enters the ISR cycle at Planning and Direction.",
          "Collection gathers raw data.",
          "Processing and Exploitation turns raw data into usable information.",
          "DCGS is a system associated with Processing and Exploitation."
        ],
        sentence: "Suggested brief shape: PIR-04 enters at [Planning and Direction], and raw data is processed through [DCGS/P&E]."
      },
      8: {
        title: "Space Operations Review",
        bullets: [
          "GEO satellites appear fixed over a point on the equator.",
          "LEO supports high resolution and short revisit.",
          "MEO is commonly associated with navigation.",
          "Counterspace threats can be kinetic or non-kinetic.",
          "Co-orbital ASAT behavior is a kinetic counterspace concern."
        ],
        sentence: "Suggested brief shape: DRAGON'S EYE-3 is collecting from [GEO]. Recommend [non-kinetic disruption] and [emission control/USSF coordination]."
      }
    };

    const GLOSSARY = [
      ["ACQ", "Target acquisition. A radar role that fixes a target location after broad detection."],
      ["ASAT", "Anti-satellite capability. Can be kinetic, such as a missile or co-orbital system."],
      ["C2", "Command and Control. Also a cyber kill chain stage where malware communicates with an attacker."],
      ["COA", "Course of Action. A possible adversary plan."],
      ["DCGS", "Distributed Common Ground System. Used to process and exploit raw ISR data."],
      ["Disinformation", "False information deliberately created or spread to deceive."],
      ["ELINT", "Electronic Intelligence. Characterizes non-communications electromagnetic emitters such as radar."],
      ["FMV", "Full Motion Video. Continuous video of a focused area."],
      ["GEO", "Geostationary Orbit. Appears fixed over one point on the equator."],
      ["GEOINT", "Geospatial Intelligence. Intelligence about activity and features on Earth using imagery and geospatial data."],
      ["GI", "Geospatial Information. Foundational map, feature, and elevation data."],
      ["IADS", "Integrated Air Defense System. A linked system of sensors, command functions, and weapons."],
      ["IE", "Information Environment. Physical, informational, and cognitive dimensions."],
      ["IIR", "Imaging Infrared. An IR seeker that sees a target image, not just a hot spot."],
      ["IR", "Infrared. Heat-based energy outside visible light."],
      ["ISR", "Intelligence, Surveillance, and Reconnaissance."],
      ["LEO", "Low Earth Orbit. Useful for high-resolution imagery and revisit."],
      ["MASINT", "Measurement and Signature Intelligence. Detects and measures signatures such as IR, radar, spectral, or nuclear signatures."],
      ["MDCOA", "Most Dangerous Course of Action. The worst plausible adversary action to prepare against."],
      ["MEO", "Medium Earth Orbit. Often used for navigation constellations."],
      ["MISO", "Military Information Support Operations. Influence activities aimed at foreign audiences."],
      ["Misinformation", "False information shared without intent to deceive."],
      ["MLCOA", "Most Likely Course of Action. The adversary action assessed as most probable."],
      ["MTI", "Moving Target Indicator. Detects movement over an area."],
      ["OPIR", "Overhead Persistent Infrared. Space-based detection of heat events such as missile launches."],
      ["P&D", "Planning and Direction. The ISR stage where requirements become collection plans."],
      ["P&E", "Processing and Exploitation. The ISR stage that converts raw data into usable information."],
      ["PIR", "Priority Intelligence Requirement. A commander question that drives collection and analysis."],
      ["SATCOM", "Satellite Communications."],
      ["SIGINT", "Signals Intelligence. Intelligence from electromagnetic signals."],
      ["WAMI", "Wide Area Motion Imagery. Large-area motion imagery with forensic look-back."]
    ];

    const IMAGE_PATHS = {
      1: "Imagery/Phase 1 - GEOINT.png",
      2: "Imagery/Phase 2 - EM Theory.png",
      3: "Imagery/Phase 3 - Radar Kill Chain.png",
      4: "Imagery/Phase 4 - Infrared Threats.png",
      5: "Imagery/Phase 5 - Cyber Intelligence.png",
      6: "Imagery/Phase 6 - Information Operations.png",
      7: "Imagery/Phase 7 - ISR Fundamentals.png",
      8: "Imagery/Phase 8 - Space Operations.png",
      capstone: "Imagery/Capstone - Hero Shot.png"
    };

    const SOURCES = [
      {
        title: "TRADOC G-2 DATE",
        url: "https://oe.tradoc.army.mil/date-decisive-action-training-environment/",
        note: "DATE is described by TRADOC G-2 as the U.S. Army official tool for scenario development and an unclassified foundation for training."
      },
      {
        title: "TRADOC G-2 Donovia Update",
        url: "https://oe.tradoc.army.mil/2024/05/21/decisive-action-training-environment-date-update-one-donovia/",
        note: "Public TRADOC article describing Donovia as a DATE training country and training adversary."
      },
      {
        title: "U.S. Army DATE World article",
        url: "https://www.army.mil/article/242997/decisive_action_training_environment_world_the_armys_authoritative_training_environment",
        note: "Public U.S. Army article describing DATE World as a simulated web-based training environment."
      },
      {
        title: "JP 2-0 Joint Intelligence",
        url: "https://irp.fas.org/doddir/dod/jp2_0.pdf",
        note: "Public joint doctrine source for intelligence disciplines, GEOINT, ISR, and all-source intelligence concepts."
      },
      {
        title: "JP 3-12 Cyberspace Operations",
        url: "https://irp.fas.org/doddir/dod/jp3_12.pdf",
        note: "Public joint doctrine source for cyberspace operations concepts."
      },
      {
        title: "JP 3-13 Information Operations",
        url: "https://irp.fas.org/doddir/dod/jp3_13.pdf",
        note: "Public joint doctrine source for the Information Environment dimensions and IO concepts."
      },
      {
        title: "JP 3-14 Space Operations",
        url: "https://www.jcs.mil/Doctrine/Joint-Doctrine-Pubs/3-0-Operations-Series/",
        note: "Public Joint Staff doctrine publication library containing space operations doctrine."
      }
    ];

    const PHASES = [
      {

        if (el) el.textContent = formatTime(state.timerSeconds);
        const submit = document.getElementById("submitActivityBtn");
        if (submit && state.instructorLock && state.timerSeconds < 60) {
          submit.disabled = true;
          submit.textContent = `Discuss First (${60 - state.timerSeconds})`;
        } else if (submit && state.instructorLock) {
          submit.disabled = false;
          submit.textContent = "Submit";
        }
      }, 1000);

      if (a.type === "SCENARIO_CLASSIFICATION") renderClassification(a);
    }
    function renderMatch(a) {
      window.matchState = { selected: null, map: {} };
      document.getElementById("activityHost").innerHTML = `<div class="match-grid"><div>${a.items.map((item,i)=>`<button class="match-item" data-i="${i}">${esc(item)}<div class="assignment" id="assign${i}">No match</div></button>`).join("")}</div><div>${a.categories.map((cat,i)=>`<button class="match-cat" data-i="${i}">${esc(cat)}</button>`).join("")}</div></div>`;
      document.querySelectorAll(".match-item").forEach(b => b.onclick = () => {
        window.matchState.selected = Number(b.dataset.i);
        document.querySelectorAll(".match-item").forEach(x=>x.classList.remove("selected"));
        b.classList.add("selected");
      });
      document.querySelectorAll(".match-cat").forEach(b => b.onclick = () => {
        if (window.matchState.selected === null) return;
        window.matchState.map[window.matchState.selected] = Number(b.dataset.i);
        document.getElementById(`assign${window.matchState.selected}`).textContent = `Matched to: ${a.categories[Number(b.dataset.i)]}`;
      });
    }
    function renderMulti(a) {
      window.multiState = new Set();
      document.getElementById("activityHost").innerHTML = `<div class="options">${a.options.map((o,i)=>`<button class="option" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
      document.querySelectorAll(".option").forEach(b => b.onclick = () => {
        const i = Number(b.dataset.i);
        if (window.multiState.has(i)) window.multiState.delete(i); else window.multiState.add(i);
        b.classList.toggle("selected");
      });
    }
    function renderShort() {
      document.getElementById("activityHost").innerHTML = `<textarea id="shortAnswer" placeholder="Write 1-3 clear sentences for the J-2 brief."></textarea>`;
    }
    function renderSequence(a) {
      window.seqState = [];
      const shuffled = a.items.map((x,i)=>({x,i})).sort((u,v)=>u.x.localeCompare(v.x));
      document.getElementById("activityHost").innerHTML = `<div class="sequence-slots">${a.items.map((_,i)=>`<div class="slot" id="slot${i}">${i+1}</div>`).join("")}</div><div class="options">${shuffled.map(o=>`<button class="seq-item" data-i="${o.i}">${esc(o.x)}</button>`).join("")}</div>`;
      document.querySelectorAll(".seq-item").forEach(b => b.onclick = () => {
        const i = Number(b.dataset.i);
        if (window.seqState.includes(i)) return;
        const slot = window.seqState.length;
        window.seqState.push(i);
        document.getElementById(`slot${slot}`).textContent = b.textContent;
        b.classList.add("selected");
      });
    }
    function emSvg() {
      return `<svg viewBox="0 0 700 360" role="img"><rect width="700" height="360" fill="#10233b"/><line x1="0" y1="300" x2="700" y2="300" stroke="#5c6e2f" stroke-width="7"/><rect x="40" y="185" width="20" height="115" fill="#a0b265"/><circle cx="50" cy="175" r="22" fill="none" stroke="#f5f1e8" stroke-width="4"/><text x="20" y="330" fill="#f5f1e8" font-size="18">Donovian Radar</text><polygon points="220,300 340,78 465,300" fill="#4f5f35" stroke="#a0b265" stroke-width="4"/><text x="286" y="330" fill="#f5f1e8" font-size="18">1500m Mountain</text><circle class="hotspot" data-id="A" cx="575" cy="255" r="26"/><text x="562" y="260" fill="#f5f1e8" font-size="24">A</text><circle class="hotspot" data-id="B" cx="520" cy="120" r="26"/><text x="507" y="126" fill="#f5f1e8" font-size="24">B</text><circle class="hotspot" data-id="C" cx="635" cy="282" r="26"/><text x="622" y="288" fill="#f5f1e8" font-size="24">C</text><path d="M62 175 L520 120" stroke="#a0b265" stroke-width="3" stroke-dasharray="8 8"/></svg>`;
    }
    function irSvg() {
      return `<svg viewBox="0 0 700 360" role="img"><rect width="700" height="360" fill="#10233b"/><text x="32" y="35" fill="#a0b265" font-size="24" font-family="monospace">IR SIGNATURE HUNT</text><rect x="70" y="105" width="90" height="45" fill="#5c6e2f"/><circle class="hotspot" data-id="tank" cx="115" cy="128" r="38"/><text x="82" y="185" fill="#f5f1e8">Tank</text><rect x="230" y="100" width="90" height="60" fill="#777"/><circle class="hotspot" data-id="bunker" cx="275" cy="130" r="38"/><text x="235" y="190" fill="#f5f1e8">Bunker</text><line x1="420" y1="120" x2="500" y2="100" stroke="#b22222" stroke-width="12"/><circle class="hotspot" data-id="tube" cx="460" cy="110" r="38"/><text x="408" y="170" fill="#f5f1e8">Fired tube</text><polygon points="105,250 155,225 205,250 155,275" fill="#f5f1e8"/><circle class="hotspot" data-id="helo" cx="155" cy="250" r="40"/><text x="112" y="315" fill="#f5f1e8">Helicopter</text><rect x="270" y="230" width="85" height="50" fill="#38502b"/><circle class="hotspot" data-id="net" cx="312" cy="255" r="35"/><text x="270" y="315" fill="#f5f1e8">Cam Net</text><circle cx="455" cy="250" r="18" fill="#b22222"/><circle class="hotspot" data-id="fire" cx="455" cy="250" r="36"/><text x="424" y="315" fill="#f5f1e8">Campfire</text><rect x="555" y="100" width="80" height="50" fill="#888"/><circle class="hotspot" data-id="box" cx="595" cy="125" r="35"/><text x="548" y="180" fill="#f5f1e8">Container</text><rect x="560" y="235" width="80" height="38" fill="#5c6e2f"/><circle class="hotspot" data-id="decoy" cx="600" cy="254" r="35"/><text x="568" y="315" fill="#f5f1e8">Decoy</text></svg>`;
    }
    function renderHotspot(a) {
      window.hotState = new Set();
      document.getElementById("activityHost").innerHTML = `<div class="svg-wrap">${a.map === "em" ? emSvg() : irSvg()}</div>`;
      document.querySelectorAll(".hotspot").forEach(el => el.onclick = () => {
        const id = el.dataset.id;
        if (window.hotState.has(id)) window.hotState.delete(id); else window.hotState.add(id);
        el.classList.toggle("selected");
      });
    }
    function renderClassification(a) {
      window.classState = {};
      document.getElementById("activityHost").innerHTML = `<div class="class-list">${a.scenarios.map((s,i)=>`<div class="class-row"><strong>${esc(s.text)}</strong><div class="class-options">${a.categories.map((c,j)=>`<button class="class-choice" data-row="${i}" data-cat="${j}">${esc(c)}</button>`).join("")}</div></div>`).join("")}</div>`;
      document.querySelectorAll(".class-choice").forEach(b => b.onclick = () => {
        const row = Number(b.dataset.row);
        state.currentResult = null;
        window.classState[row] = Number(b.dataset.cat);
        document.querySelectorAll(`.class-choice[data-row="${row}"]`).forEach(x=>x.classList.remove("selected"));
        b.classList.add("selected");
      });
    }
    function submitActivity(a) {
      stopTimer();
      let earned = 0;
      let summary = "";
      let response = "No answer recorded.";
      const maxPoints = activityPoints();
      if (a.type === "CLICK_TO_MATCH") {
        const total = a.correctMap.length;
        let correct = 0;
        a.correctMap.forEach((cat,i)=>{ if (window.matchState.map[i] === cat) correct++; });
        earned = maxPoints * correct / total;
        summary = `${correct} of ${total} matches correct.`;
        response = a.items.map((item,i) => `${item} -> ${a.categories[window.matchState.map[i]] || "No match"}`).join("; ");
      }
      if (a.type === "MULTI_SELECT") {
        const selected = [...window.multiState];
        const correct = a.correct;
        const good = selected.filter(i=>correct.includes(i)).length;
        const bad = selected.filter(i=>!correct.includes(i)).length;
        earned = Math.max(0, maxPoints * ((good - bad * .5) / correct.length));
        summary = `${good} correct selections, ${bad} incorrect selections.`;
        response = selected.length ? selected.map(i => a.options[i]).join("; ") : "No selections.";
      }
      if (a.type === "SHORT_ANSWER_KEYWORD") {
        const text = document.getElementById("shortAnswer").value.trim();
        const hits = a.keywordSets.filter(set => set.some(k => text.toLowerCase().includes(k.toLowerCase()))).length;
        earned = maxPoints * hits / a.keywordSets.length;
        summary = `${hits} of ${a.keywordSets.length} required concept groups found.`;
        state.currentResult = { text: text || a.fallback };
        response = text || "[Blank answer. Suggested fallback used.]";
      }
      if (a.type === "SEQUENCE_PUZZLE") {
        const ok = a.correctOrder.every((v,i)=>window.seqState[i] === v);
        earned = ok ? maxPoints : 0;
        summary = ok ? "Sequence correct." : "Sequence needs review.";
        response = window.seqState.map(i => a.items[i]).join(" -> ") || "No sequence selected.";
      }
      if (a.type === "HOT_SPOT_MAP") {
        const goodIds = a.spots.filter(s=>s.correct).map(s=>s.id);
        const selected = [...window.hotState];
        const good = selected.filter(id=>goodIds.includes(id)).length;
        const bad = selected.filter(id=>!goodIds.includes(id)).length;
        earned = Math.max(0, maxPoints * ((good - bad * .5) / goodIds.length));
        summary = `${good} correct hot spots, ${bad} incorrect hot spots.`;
        response = selected.length ? selected.map(id => (a.spots.find(s => s.id === id) || {}).label || id).join("; ") : "No hot spots selected.";
      }
      if (a.type === "SCENARIO_CLASSIFICATION") {
        let correct = 0;
        a.scenarios.forEach((s,i)=>{ if (window.classState[i] === s.correct) correct++; });
        earned = maxPoints * correct / a.scenarios.length;
        summary = `${correct} of ${a.scenarios.length} scenarios classified correctly.`;
        response = a.scenarios.map((s,i) => `${s.text} -> ${a.categories[window.classState[i]] || "No category"}`).join("; ");
      }
      if (!state.activityLog[currentPhase().id]) state.activityLog[currentPhase().id] = {};
      state.activityLog[currentPhase().id][state.activityKey] = {
        key: state.activityKey,
        title: a.title,
        prompt: a.prompt,
        response,
        summary,
        points: Math.round(earned)
      };
      addScore(earned);
      document.getElementById("feedback").classList.remove("hidden");
      document.getElementById("feedback").innerHTML = `<h3>Activity Feedback</h3><p>${esc(summary)}</p><p>Points earned: ${Math.round(earned)} / ${maxPoints}</p>`;
      document.getElementById("submitActivityBtn").classList.add("hidden");
      document.getElementById("nextActivityBtn").classList.remove("hidden");
    }
    function nextAfterActivity() {
      if (state.activityKey === "A") return renderActivity("B");
      if (state.activityKey === "B") return renderActivity("C");
      lockBriefContribution();
    }
    function lockBriefContribution() {
      const p = currentPhase();
      const a = p.activityC;
      let content = state.skipped[p.briefSection] ? "[CONTRIBUTION NOT MADE - SKIPPED]" : p.lockText;
      if (!state.skipped[p.briefSection] && a.type === "SHORT_ANSWER_KEYWORD" && state.currentResult && state.currentResult.text) content = state.currentResult.text;
      state.brief[p.briefSection] = content;
      render(`
        <div class="kicker">Brief Lock-In</div>
        <h2>${esc(p.briefSection)}</h2>
        <div class="panel"><p>${esc(content)}</p></div>
        <div class="button-row"><button id="nextPhaseBtn">${state.phaseIndex === PHASES.length - 1 ? "Begin Capstone" : "Next Phase"}</button></div>
      `);
      document.getElementById("nextPhaseBtn").onclick = () => {
        state.phaseIndex++;
        if (state.phaseIndex >= PHASES.length) renderCapstoneReview();
        else renderIntelUpdate();
      };
    }
    function skipActivity() {
      if (!["A","B","C"].includes(state.activityKey)) return;
      stopTimer();
      if (state.activityKey === "C") {
        const p = currentPhase();
        state.skipped[p.briefSection] = true;
        state.brief[p.briefSection] = "[CONTRIBUTION NOT MADE - SKIPPED]";
        return lockBriefContribution();
      }
      nextAfterActivity();
    }
    function skipPhase() {
      const p = currentPhase();
      state.skipped[p.briefSection] = true;
      state.brief[p.briefSection] = "[CONTRIBUTION NOT MADE - SKIPPED]";
      state.phaseIndex++;
      if (state.phaseIndex >= PHASES.length) renderCapstoneReview();
      else renderIntelUpdate();
    }
    function restartPhase() { renderIntelUpdate(); }
    function renderCapstoneReview() {
      headTitle.textContent = "Capstone // Review the J-2 Brief";
      render(`
        <div class="kicker">Capstone Stage 1</div>
        <h2>Review and Edit the Brief</h2>
        <img class="phase-image" src="${esc(IMAGE_PATHS.capstone)}" alt="Training image for capstone J-2 brief">
        <p>Edits do not change score. They improve the product you hand to the instructor.</p>
        ${BRIEF_SECTIONS.map(sec=>`<label>${esc(sec)}</label><textarea data-section="${esc(sec)}">${esc(state.brief[sec] || "[CONTRIBUTION NOT MADE - SKIPPED]")}</textarea>`).join("")}
        <div class="button-row"><button id="saveEditsBtn">Continue to MLCOA</button></div>
      `);
      document.getElementById("saveEditsBtn").onclick = () => {
        document.querySelectorAll("textarea[data-section]").forEach(t => state.brief[t.dataset.section] = t.value.trim());
        renderCapstoneMlcoa();
      };
    }
    function renderCapstoneMlcoa() {
      state.activityKey = "capstone";
      const a = CAPSTONE.mlcoa;
      render(`
        <div class="kicker">Capstone Stage 2</div><h2>Most Likely Course of Action</h2>
        <p>${esc(a.prompt)}</p>
        <div class="options">${a.options.map((o,i)=>`<button class="option" data-i="${i}">${esc(o)}</button>`).join("")}</div>
        <label>What one indicator would change your assessment?</label><textarea id="indicator"></textarea>
        <div class="button-row"><button id="mlcoaSubmit">Submit MLCOA</button></div>
      `);
      const selected = new Set();
      document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.i); selected.has(i)?selected.delete(i):selected.add(i); b.classList.toggle("selected"); });
      document.getElementById("mlcoaSubmit").onclick = () => {
        state.capstone.mlcoa = [...selected];
        state.capstone.indicator = document.getElementById("indicator").value.trim();
        scoreSet(selected, a.correct, a.points);
        renderCapstoneMdcoa();
      };
    }
    function renderCapstoneMdcoa() {
      const a = CAPSTONE.mdcoa;
      render(`
        <div class="kicker">Capstone Stage 3</div><h2>Most Dangerous Course of Action</h2>
        <p>${esc(a.prompt)}</p>
        <div class="options">${a.options.map((o,i)=>`<button class="option" data-i="${i}">${esc(o)}</button>`).join("")}</div>
        <div class="button-row"><button id="mdcoaSubmit">Submit MDCOA</button></div>
      `);
      const selected = new Set();
      document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.i); selected.has(i)?selected.delete(i):selected.add(i); b.classList.toggle("selected"); });
      document.getElementById("mdcoaSubmit").onclick = () => {
        state.capstone.mdcoa = [...selected];
        scoreSet(selected, a.correct, a.points);
        renderSubmitBrief();
      };
    }
    function scoreSet(selected, correct, points) {
      const arr = [...selected];
      const good = arr.filter(i=>correct.includes(i)).length;
      const bad = arr.filter(i=>!correct.includes(i)).length;
      addScore(Math.max(0, points * ((good - bad * .5) / correct.length)));
    }
    function renderSubmitBrief() {
      render(`
        <div class="kicker">Capstone Stage 4</div>
        <h2>Submit Final Brief</h2>
        <div class="panel"><pre style="white-space:pre-wrap">${esc(briefText())}</pre></div>
        <p id="copyStatus" class="copy-status"></p>
        <div class="button-row">
          <button id="printBtn">Print Brief</button>
          <button id="copyBtn">Copy Brief as Text</button>
          <button id="downloadBtn">Download Brief / Assessment</button>
          <button id="finalBtn">Submit Final Brief</button>
        </div>
      `);
      document.getElementById("printBtn").onclick = () => window.print();
      document.getElementById("copyBtn").onclick = async () => {
        try { await navigator.clipboard.writeText(briefText()); document.getElementById("copyStatus").textContent = "Brief copied."; }
        catch { document.getElementById("copyStatus").textContent = "Clipboard blocked. Select the text above and copy it manually."; }
      };
      document.getElementById("downloadBtn").onclick = downloadAssessment;
      document.getElementById("finalBtn").onclick = renderResults;
    }
    function briefText() {
      const lines = [];
      lines.push("=========================================================");
      lines.push("JTF CORAL SHIELD - J-2 INTELLIGENCE BRIEF");
      lines.push(`TEAM: ${state.team || "Not Assigned"}    DATE: ${new Date().toLocaleDateString()}`);
      lines.push("=========================================================");
      BRIEF_SECTIONS.forEach(sec => { lines.push("", sec, "-".repeat(sec.length), state.brief[sec] || "[CONTRIBUTION NOT MADE - SKIPPED]"); });
      lines.push("", "ASSESSMENT - MOST LIKELY COURSE OF ACTION", "-----------------------------------------");
      lines.push(state.capstone.mlcoa.map(i=>CAPSTONE.mlcoa.options[i]).join("; ") || "Not submitted");
      lines.push(`Indicator that would change assessment: ${state.capstone.indicator || "Not stated"}`);
      lines.push("", "ASSESSMENT - MOST DANGEROUS COURSE OF ACTION", "--------------------------------------------");
      lines.push(state.capstone.mdcoa.map(i=>CAPSTONE.mdcoa.options[i]).join("; ") || "Not submitted");
      lines.push("", `FINAL SCORE: ${state.score} / ${totalPossible()}`, `ASSESSED: ${scoreTitle()}`);
      lines.push("", "ACTIVITY PERFORMANCE LOG", "------------------------");
      PHASES.forEach(phase => {
        lines.push("", `PHASE ${phase.id}: ${phase.title}`);
        ["A","B","C"].forEach(key => {
          const log = (state.activityLog[phase.id] || {})[key];
          if (!log) {
            lines.push(`Activity ${key}: Not completed or skipped.`);
            return;
          }
          lines.push(`Activity ${key} - ${log.title}`);
          lines.push(`Prompt: ${log.prompt}`);
          lines.push(`Team Answer: ${log.response}`);
          lines.push(`Feedback: ${log.summary}`);
          lines.push(`Score: ${log.points} / 20`);
        });
      });
      lines.push("", "SOURCE / CLASSIFICATION STATEMENT", "---------------------------------");
      lines.push("This classroom exercise was built from public, unclassified training and doctrine sources plus fictional instructional content. It contains no CUI, no operational data, no real intelligence reporting, no classified tactics, and no restricted collection requirements.");
      SOURCES.forEach(s => lines.push(`${s.title}: ${s.url}`));
      return lines.join("\n");
    }
    function downloadAssessment() {
      const safeTeam = (state.team || "team").replace(/[^a-z0-9_-]+/gi, "_").replace(/^_+|_+$/g, "") || "team";
      const blob = new Blob([briefText()], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${safeTeam}_Donovian_Horizon_J2_Assessment.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
    function totalPossible() {
      const phaseTotal = PHASES.length * 3 * activityPoints();
      return phaseTotal + CAPSTONE.mlcoa.points + CAPSTONE.mdcoa.points;
    }
    function activityPoints() { return 20; }
    function scoreTitle() {
      const pct = state.score / totalPossible();
      if (pct >= .9) return "JFC TRUSTED ADVISOR";
      if (pct >= .7) return "ASSESSED COMPETENT";
      if (pct >= .5) return "REQUIRES ADDITIONAL TRAINING";
      return "RECOMMEND REMEDIAL REVIEW WITH INSTRUCTOR";
    }
    function renderResults() {
      localStorage.removeItem("donovianHorizonSave");
      render(`
        <div class="kicker">Final Results</div>
        <h2>${esc(state.team)}</h2>
        <div class="result-score">${state.score}</div>
        <div class="panel"><h3>${scoreTitle()}</h3><p>Total possible: ${totalPossible()}</p><p>Write your team name and final score on the leaderboard. Hand your brief to the instructor.</p></div>
        <div class="button-row"><button id="downloadFinalBtn">Download Brief / Assessment</button><button id="restartBtn">Restart Exercise</button></div>
      `);
      document.getElementById("downloadFinalBtn").onclick = downloadAssessment;
      document.getElementById("restartBtn").onclick = resetAll;
    }
    function resetAll() {
      Object.assign(state, { team:"", screen:"intro", phaseIndex:0, activityKey:"intro", score:0, brief:Object.fromEntries(BRIEF_SECTIONS.map(s=>[s,""])), skipped:{}, timerSeconds:0, paused:false, currentResult:null, activityLog:{}, capstone:{mlcoa:[], mdcoa:[], indicator:""} });
      renderIntro();
    }
    document.getElementById("menuBtn").onclick = () => menu.classList.toggle("hidden");
    document.getElementById("helpBtn").onclick = () => showHelp("lesson");
    document.getElementById("sourcesBtn").onclick = () => showHelp("sources");
    document.getElementById("lessonHelpTab").onclick = () => showHelp("lesson");
    document.getElementById("glossaryTab").onclick = () => showHelp("glossary");
    document.getElementById("sourcesTab").onclick = () => showHelp("sources");
    document.getElementById("closeHelpBtn").onclick = () => helpModal.classList.add("hidden");
    helpModal.addEventListener("click", event => {
      if (event.target === helpModal) helpModal.classList.add("hidden");
    });
    document.getElementById("pauseBtn").onclick = () => { state.paused = true; pauseOverlay.classList.remove("hidden"); menu.classList.add("hidden"); };
    document.getElementById("resumePauseBtn").onclick = () => { state.paused = false; pauseOverlay.classList.add("hidden"); };
    document.getElementById("skipActivityBtn").onclick = skipActivity;
    document.getElementById("skipPhaseBtn").onclick = () => { if (confirm("Skip this phase? Its brief section will be marked skipped.")) skipPhase(); };
    document.getElementById("restartPhaseBtn").onclick = () => { if (confirm("Restart current phase? Current phase work will be reset.")) restartPhase(); };
    document.getElementById("quitBtn").onclick = () => { if (confirm("Quit to intro and lose current progress?")) resetAll(); };
    document.getElementById("toggleLockBtn").onclick = () => { state.instructorLock = !state.instructorLock; updateChrome(); };
    document.getElementById("saveBtn").onclick = () => { localStorage.setItem("donovianHorizonSave", JSON.stringify(state)); menu.classList.add("hidden"); };
    document.getElementById("resumeBtn").onclick = () => {
      const saved = localStorage.getItem("donovianHorizonSave");
      if (!saved) return alert("No saved progress found.");
      Object.assign(state, JSON.parse(saved));
      if (state.phaseIndex >= PHASES.length) renderCapstoneReview(); else if (state.activityKey === "A" || state.activityKey === "B" || state.activityKey === "C") renderActivity(state.activityKey); else renderIntelUpdate();
    };
    renderIntro();
  </script>
</body>
