<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ACH Matrix Builder</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  background: #edf1f7; color: #1a2035;
  min-height: 100vh; padding: 1.5rem 1rem 4rem;
}
.page { max-width: 1300px; margin: 0 auto; }

/* ── Header ── */
#page-header {
  background: linear-gradient(135deg, #1B3A6B 0%, #254e9a 100%);
  color: #fff; padding: 1rem 1.4rem; border-radius: 10px;
  margin-bottom: 1.1rem; box-shadow: 0 4px 18px rgba(27,58,107,.35);
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.header-text { flex: 1; }
#page-header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: .02em; }
#page-header .subtitle { font-size: .8rem; opacity: .7; margin-top: .15rem; }
.back-link {
  color: #a8c4f0; font-size: .84rem; text-decoration: none;
  border: 1px solid rgba(168,196,240,.4); padding: .35rem .8rem;
  border-radius: 5px; white-space: nowrap; transition: background .15s;
}
.back-link:hover { background: rgba(255,255,255,.1); color: #fff; }

/* ── Scenario setup card ── */
#scenario-card {
  background: #fff; border-radius: 10px; padding: 1rem 1.3rem;
  margin-bottom: 1rem; box-shadow: 0 2px 10px rgba(0,0,0,.07);
  border-left: 4px solid #2E75B6;
}
#scenario-card h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: #2E75B6; margin-bottom: .7rem; font-weight: 700; }
.setup-row { display: flex; align-items: flex-start; gap: .8rem; margin-bottom: .6rem; }
.setup-row:last-child { margin-bottom: 0; }
.setup-row label { font-size: .83rem; color: #555; font-weight: 600; min-width: 100px; padding-top: .45rem; }
.setup-input {
  flex: 1; padding: .42rem .7rem; border: 1.5px solid #c5d0e0; border-radius: 6px;
  font-size: .9rem; font-family: inherit; color: #1a2035; outline: none;
}
.setup-input:focus { border-color: #2E75B6; box-shadow: 0 0 0 3px rgba(46,117,182,.15); }
.setup-textarea {
  flex: 1; padding: .42rem .7rem; border: 1.5px solid #c5d0e0; border-radius: 6px;
  font-size: .88rem; font-family: inherit; color: #1a2035; outline: none;
  min-height: 64px; resize: vertical;
}
.setup-textarea:focus { border-color: #2E75B6; box-shadow: 0 0 0 3px rgba(46,117,182,.15); }

/* ── Info bar ── */
#info-bar {
  display: flex; flex-wrap: wrap; gap: .5rem 1.8rem; align-items: center;
  background: #fff; border: 1px solid #dde4f0; border-radius: 8px;
  padding: .55rem 1rem; margin-bottom: 1rem; font-size: .86rem;
  box-shadow: 0 2px 6px rgba(0,0,0,.05);
}
.legend-items { display: flex; gap: .85rem; flex-wrap: wrap; align-items: center; }
.leg { display: flex; align-items: center; gap: .3rem; color: #444; }
.swatch {
  width: 26px; height: 21px; border-radius: 4px; border: 1px solid #bbb;
  font-size: .72rem; display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.sw-c  { background: #cef0d8; color: #155724; border-color: #90d4a8; }
.sw-i  { background: #fdd9dc; color: #721c24; border-color: #f0a0a6; }
.sw-na { background: #e6e9ed; color: #495057; border-color: #bcc0c7; }
.sw-bl { background: #fff; color: #999; border-color: #ccc; }
#key-rule { font-weight: 700; color: #1B3A6B; font-size: .88rem; }

/* ── Toolbar ── */
#toolbar { display: flex; gap: .6rem; margin-bottom: .85rem; flex-wrap: wrap; }
.btn {
  padding: .45rem 1.1rem; border: none; border-radius: 6px;
  font-size: .86rem; font-weight: 600; cursor: pointer;
  transition: background .15s; letter-spacing: .02em; white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-navy    { background: #1B3A6B; color: #fff; box-shadow: 0 2px 6px rgba(27,58,107,.28); }
.btn-navy:hover    { background: #2355a0; }
.btn-outline { background: #fff; color: #1B3A6B; border: 1.5px solid #1B3A6B; }
.btn-outline:hover { background: #eef3fa; }
.btn-red     { background: #fff; color: #9b1c1c; border: 1.5px solid #f0a0a6; }
.btn-red:hover     { background: #fff5f5; }

/* ── Matrix card ── */
#matrix-card {
  background: #fff; border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,.09); overflow: hidden;
}
#matrix-wrap { overflow-x: auto; }

table { border-collapse: collapse; font-size: .9rem; width: max-content; min-width: 100%; }
th, td { border: 1px solid #dce5f0; text-align: center; padding: .4rem .3rem; vertical-align: middle; }

/* Evidence column - sticky */
.col-ev { position: sticky; left: 0; z-index: 2; }

/* Header row */
thead th {
  background: #1B3A6B; color: #fff;
  padding: .55rem .45rem; line-height: 1.3; font-weight: 600; font-size: .88rem;
}
thead th.col-ev { text-align: left; padding-left: .8rem; min-width: 220px; z-index: 3; }

/* Hypothesis header cell */
.hyp-header { min-width: 130px; }
.hyp-input-wrap { display: flex; flex-direction: column; gap: .3rem; align-items: center; }
.hyp-input {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
  color: #fff; border-radius: 4px; padding: .25rem .4rem;
  font-size: .82rem; font-weight: 600; text-align: center;
  width: 100%; outline: none; font-family: inherit;
}
.hyp-input::placeholder { color: rgba(255,255,255,.5); }
.hyp-input:focus { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.6); }
.hyp-label { font-size: .74rem; opacity: .65; }
.remove-hyp {
  background: rgba(255,80,80,.25); border: 1px solid rgba(255,120,120,.4); color: #ffb3b3;
  border-radius: 4px; padding: .15rem .45rem; font-size: .72rem; cursor: pointer;
  font-family: inherit; transition: background .15s;
}
.remove-hyp:hover { background: rgba(255,80,80,.45); }
.remove-hyp:disabled { opacity: .3; cursor: not-allowed; }

/* Add hypothesis header button */
th.add-hyp-th {
  background: #162f56; border-left: 2px dashed rgba(255,255,255,.2);
  min-width: 52px; cursor: pointer;
}
.add-hyp-btn {
  background: none; border: none; color: rgba(255,255,255,.6);
  font-size: 1.4rem; cursor: pointer; line-height: 1; padding: .2rem .4rem;
  transition: color .15s;
}
.add-hyp-btn:hover { color: #fff; }

/* Evidence rows */
.ev-label-cell {
  text-align: left; background: #f7f9fc; padding: .4rem .5rem;
}
tbody tr:nth-child(even) .ev-label-cell { background: #f0f4fa; }
tbody tr:nth-child(even) td { background: #fafbff; }

.ev-row-wrap { display: flex; align-items: center; gap: .4rem; }
.ev-input {
  flex: 1; background: transparent; border: 1px solid transparent;
  border-radius: 4px; padding: .25rem .35rem;
  font-size: .85rem; font-family: inherit; color: #1a2035; outline: none;
  min-width: 160px;
}
.ev-input:focus { border-color: #2E75B6; background: #fff; }
.remove-ev {
  flex-shrink: 0; background: none; border: none; color: #c0c8d8; cursor: pointer;
  font-size: 1rem; line-height: 1; padding: .1rem .3rem; border-radius: 3px;
  transition: color .15s, background .15s;
}
.remove-ev:hover { color: #dc3545; background: #fff0f0; }
.remove-ev:disabled { opacity: .2; cursor: not-allowed; }

/* Dropdowns */
.sel-wrap { position: relative; display: inline-block; }
.sel-wrap::after {
  content: '▾'; position: absolute; right: 5px; top: 50%;
  transform: translateY(-50%); font-size: .65rem; color: #888; pointer-events: none;
}
.cell-select {
  width: 74px; padding: .32rem 1.2rem .32rem .4rem;
  border-radius: 5px; border: 1.5px solid #c5d0e0;
  font-size: .85rem; font-weight: 600; cursor: pointer;
  appearance: none; -webkit-appearance: none;
  background: #fff; color: #555;
  transition: background .12s, border-color .12s; outline: none;
}
.cell-select:focus { border-color: #2E75B6; box-shadow: 0 0 0 2px rgba(46,117,182,.18); }
.cell-select.state-c  { background: #cef0d8; color: #155724; border-color: #7ecb97; }
.cell-select.state-i  { background: #fdd9dc; color: #721c24; border-color: #f09fa5; }
.cell-select.state-na { background: #e6e9ed; color: #495057; border-color: #adb5bd; }

/* Add evidence row */
#add-ev-row { border-top: 2px dashed #d0dbef; }
#add-ev-row td {
  padding: .35rem; background: #f7f9fc; text-align: left;
  position: sticky; left: 0;
}
.add-ev-btn {
  background: none; border: none; color: #2E75B6; font-size: .86rem;
  font-weight: 600; cursor: pointer; padding: .25rem .5rem; border-radius: 5px;
  font-family: inherit; transition: background .15s;
}
.add-ev-btn:hover { background: #eef3fa; }

/* Count row */
#count-row td { background: #eef3fa; font-weight: 700; font-size: .87rem; color: #1B3A6B; padding: .5rem .35rem; }
#count-row td:first-child { text-align: left; padding-left: .9rem; color: #666; font-weight: 400; font-size: .82rem; }
#count-row td.winner-col { background: #fffbe6 !important; outline: 3px solid #b08800; outline-offset: -2px; }

/* Winner row */
#winner-row td { padding: .6rem .35rem; font-size: .84rem; border-top: 2px solid #d0dbed; background: #f7f9fc; }
#winner-row td:first-child { text-align: left; padding-left: .9rem; font-weight: 600; color: #1B3A6B; }
#winner-row td.winner-col { background: #fffbe6 !important; outline: 3px solid #b08800; outline-offset: -2px; }
thead th.winner-hdr { box-shadow: inset 0 0 0 3px #f0c000; }
.winner-badge {
  display: inline-block; background: #b08800; color: #fff;
  border-radius: 5px; padding: .15rem .55rem; font-size: .78rem; font-weight: 700;
}
#tie-msg {
  display: inline-block; color: #7a4800; font-weight: 700;
  font-size: .82rem; padding: .15rem .45rem; background: #fff3cd; border-radius: 4px;
}

@media print {
  body { background: #fff; padding: 0; }
  #toolbar, .remove-hyp, .remove-ev, #add-ev-row, th.add-hyp-th,
  .back-link, #scenario-card h2 { display: none !important; }
  #matrix-card { box-shadow: none; border: 1px solid #ccc; }
  .hyp-input { background: transparent; border: none; color: #fff; }
}
</style>
</head>
<body>
<div class="page">

<div id="page-header">
  <div class="header-text">
    <h1>ACH Matrix Builder</h1>
    <div class="subtitle">Build a custom Analysis of Competing Hypotheses matrix from scratch</div>
  </div>
  <a class="back-link" href="./ach.html">&#8592; Back to Bakery Dilemma</a>
</div>

<div id="scenario-card">
  <h2>Scenario Setup</h2>
  <div class="setup-row">
    <label for="sc-title">Title</label>
    <input id="sc-title" class="setup-input" type="text" placeholder="Name your scenario or intelligence question…"/>
  </div>
  <div class="setup-row">
    <label for="sc-desc">Description</label>
    <textarea id="sc-desc" class="setup-textarea" placeholder="Briefly describe the situation students will analyze…"></textarea>
  </div>
</div>

<div id="info-bar">
  <div class="legend-items">
    <div class="leg"><div class="swatch sw-c">C</div> Consistent</div>
    <div class="leg"><div class="swatch sw-i">I</div> Inconsistent</div>
    <div class="leg"><div class="swatch sw-na">N/A</div> Not Applicable</div>
    <div class="leg"><div class="swatch sw-bl">&nbsp;</div> Blank</div>
  </div>
  <div id="key-rule">Key Rule: Select the hypothesis with the LEAST evidence against it.</div>
</div>

<div id="toolbar">
  <button class="btn btn-outline" onclick="window.print()">&#128438; Print / Save PDF</button>
  <button class="btn btn-red"     onclick="clearCells()">Clear All Cells</button>
  <button class="btn btn-navy"    onclick="resetAll()">Reset Everything</button>
</div>

<div id="matrix-card">
  <div id="matrix-wrap">
    <table id="ach-table">
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
      <tfoot>
        <tr id="add-ev-row"><td colspan="99"><button class="add-ev-btn" onclick="addEv()">+ Add Evidence Row</button></td></tr>
        <tr id="count-row"><td>Inconsistent (I) count</td></tr>
        <tr id="winner-row"><td id="assess-label">Assessment</td></tr>
      </tfoot>
    </table>
  </div>
</div>

</div>
<script>
  // ── State ──
  let hyps = [
    { id:1, name:'Hypothesis 1' },
    { id:2, name:'Hypothesis 2' },
  ];
  let evs = [
    { id:1, text:'Evidence Item 1' },
    { id:2, text:'Evidence Item 2' },
  ];
  let grid = evs.map(() => hyps.map(() => ''));
  let nextHid = 3, nextEid = 3;

  const CLS = { '':'', 'C':'state-c', 'I':'state-i', 'N/A':'state-na' };

  // ── Build header ──
  function buildHeader() {
    const tr = document.getElementById('thead-row');
    tr.innerHTML = '';

    // Evidence column
    const th0 = document.createElement('th');
    th0.className = 'col-ev';
    th0.textContent = 'Evidence';
    tr.appendChild(th0);

    // Hypothesis columns
    hyps.forEach((h, c) => {
      const th = document.createElement('th');
      th.id = `hdr-${c}`;
      th.className = 'hyp-header';
      const wrap = document.createElement('div');
      wrap.className = 'hyp-input-wrap';

      const lbl = document.createElement('div');
      lbl.className = 'hyp-label';
      lbl.textContent = `H${c + 1}`;

      const inp = document.createElement('input');
      inp.className = 'hyp-input';
      inp.type = 'text';
      inp.value = h.name;
      inp.placeholder = `Hypothesis ${c + 1}`;
      inp.addEventListener('input', () => { hyps[c].name = inp.value; });

      const rm = document.createElement('button');
      rm.className = 'remove-hyp';
      rm.textContent = '✕ Remove';
      rm.disabled = hyps.length <= 2;
      rm.addEventListener('click', () => removeHyp(c));

      wrap.append(lbl, inp, rm);
      th.appendChild(wrap);
      tr.appendChild(th);
    });

    // Add hypothesis button
    const thAdd = document.createElement('th');
    thAdd.className = 'add-hyp-th';
    thAdd.title = 'Add Hypothesis';
    const addBtn = document.createElement('button');
    addBtn.className = 'add-hyp-btn';
    addBtn.textContent = '+';
    addBtn.onclick = addHyp;
    thAdd.appendChild(addBtn);
    tr.appendChild(thAdd);
  }

  // ── Build body ──
  function buildBody() {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    evs.forEach((ev, r) => {
      const tr = document.createElement('tr');

      // Evidence label cell
      const td0 = document.createElement('td');
      td0.className = 'ev-label-cell col-ev';
      const wrap = document.createElement('div');
      wrap.className = 'ev-row-wrap';

      const inp = document.createElement('input');
      inp.className = 'ev-input';
      inp.type = 'text';
      inp.value = ev.text;
      inp.placeholder = `Evidence item ${r + 1}`;
      inp.addEventListener('input', () => { evs[r].text = inp.value; });

      const rm = document.createElement('button');
      rm.className = 'remove-ev';
      rm.title = 'Remove this evidence row';
      rm.textContent = '✕';
      rm.disabled = evs.length <= 1;
      rm.addEventListener('click', () => removeEv(r));

      wrap.append(inp, rm);
      td0.appendChild(wrap);
      tr.appendChild(td0);

      // Cell dropdowns
      hyps.forEach((_, c) => {
        const td = document.createElement('td');
        const sw = document.createElement('div');
        sw.className = 'sel-wrap';
        const sel = document.createElement('select');
        sel.className = 'cell-select ' + CLS[grid[r][c]];
        sel.id = `cell-${r}-${c}`;
        sel.setAttribute('aria-label', `E${r+1} vs H${c+1}`);
        ['', 'C', 'I', 'N/A'].forEach(v => {
          const opt = document.createElement('option');
          opt.value = v; opt.textContent = v || '—';
          if (v === grid[r][c]) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.addEventListener('change', () => {
          grid[r][c] = sel.value;
          sel.className = 'cell-select ' + CLS[sel.value];
          updateCounts();
        });
        sw.appendChild(sel);
        td.appendChild(sw);
        tr.appendChild(td);
      });

      // Empty cell under add-hyp column
      const tdPad = document.createElement('td');
      tdPad.style.background = '#f0f4fa';
      tr.appendChild(tdPad);

      tbody.appendChild(tr);
    });
  }

  // ── Build count / winner footer cells ──
  function buildFooter() {
    const countRow  = document.getElementById('count-row');
    const winnerRow = document.getElementById('winner-row');

    // Remove all cells except first
    while (countRow.cells.length  > 1) countRow.deleteCell(1);
    while (winnerRow.cells.length > 1) winnerRow.deleteCell(1);

    hyps.forEach((_, c) => {
      const tc = document.createElement('td');
      tc.id = `cnt-${c}`; tc.textContent = '0';
      countRow.appendChild(tc);

      const tw = document.createElement('td');
      tw.id = `assess-${c}`;
      winnerRow.appendChild(tw);
    });

    // Pad under add-hyp column
    const padC = document.createElement('td'); padC.style.background = '#eef3fa';
    const padW = document.createElement('td'); padW.style.background = '#f7f9fc';
    countRow.appendChild(padC);
    winnerRow.appendChild(padW);
  }

  // ── Full render ──
  function render() {
    buildHeader();
    buildBody();
    buildFooter();
    updateCounts();
  }

  // ── Live counts + winner assessment ──
  function updateCounts() {
    const counts = Array(hyps.length).fill(0);
    for (let r = 0; r < evs.length; r++)
      for (let c = 0; c < hyps.length; c++)
        if (grid[r][c] === 'I') counts[c]++;

    // Reset styles
    hyps.forEach((_, c) => {
      const hdr = document.getElementById(`hdr-${c}`);
      const cnt = document.getElementById(`cnt-${c}`);
      const asc = document.getElementById(`assess-${c}`);
      if (hdr) hdr.classList.remove('winner-hdr');
      if (cnt) { cnt.classList.remove('winner-col'); cnt.textContent = counts[c]; }
      if (asc) { asc.classList.remove('winner-col'); asc.innerHTML = ''; }
    });
    document.getElementById('assess-label').textContent = 'Assessment';

    if (!counts.some(v => v > 0)) return;

    const min = Math.min(...counts);
    const winners = counts.reduce((a, v, i) => v === min ? [...a, i] : a, []);

    if (winners.length > 1) {
      winners.forEach(c => {
        document.getElementById(`hdr-${c}`)?.classList.add('winner-hdr');
        document.getElementById(`cnt-${c}`)?.classList.add('winner-col');
        document.getElementById(`assess-${c}`)?.classList.add('winner-col');
      });
      document.getElementById('assess-label').innerHTML =
        'Assessment &nbsp;<span id="tie-msg">Tied — more analysis needed</span>';
    } else {
      const w = winners[0];
      document.getElementById(`hdr-${w}`)?.classList.add('winner-hdr');
      document.getElementById(`cnt-${w}`)?.classList.add('winner-col');
      const asc = document.getElementById(`assess-${w}`);
      if (asc) { asc.classList.add('winner-col'); asc.innerHTML = '<span class="winner-badge">Most Likely</span>'; }
    }
  }

  // ── Mutations ──
  function addHyp() {
    hyps.push({ id: nextHid++, name: `Hypothesis ${hyps.length + 1}` });
    grid.forEach(row => row.push(''));
    render();
  }

  function removeHyp(idx) {
    if (hyps.length <= 2) return;
    hyps.splice(idx, 1);
    grid.forEach(row => row.splice(idx, 1));
    render();
  }

  function addEv() {
    evs.push({ id: nextEid++, text: `Evidence Item ${evs.length + 1}` });
    grid.push(Array(hyps.length).fill(''));
    render();
  }

  function removeEv(idx) {
    if (evs.length <= 1) return;
    evs.splice(idx, 1);
    grid.splice(idx, 1);
    render();
  }

  function clearCells() {
    grid = evs.map(() => hyps.map(() => ''));
    render();
  }

  function resetAll() {
    hyps = [{ id:1, name:'Hypothesis 1' }, { id:2, name:'Hypothesis 2' }];
    evs  = [{ id:1, text:'Evidence Item 1' }, { id:2, text:'Evidence Item 2' }];
    grid = evs.map(() => hyps.map(() => ''));
    nextHid = 3; nextEid = 3;
    document.getElementById('sc-title').value = '';
    document.getElementById('sc-desc').value  = '';
    render();
  }

  render();
</script>
</body>
</html>
