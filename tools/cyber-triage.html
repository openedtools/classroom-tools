<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Incident Triage | IIAOC 4.5</title>
<style>
/* ── RESET & VARIABLES ─────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;
  --border:#30363d;--border2:#484f58;
  --green:#3fb950;--green-d:#1a3f22;
  --red:#f85149;--red-d:#4a1b1b;
  --blue:#58a6ff;--blue-d:#1c2f4a;
  --yellow:#e3b341;--yellow-d:#3d2f10;
  --purple:#a371f7;--purple-d:#2d1f4a;
  --text:#e6edf3;--dim:#8b949e;--muted:#484f58;
  --accent:#238636;--accent2:#2ea043;
}
html,body{min-height:100vh}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:16px 16px 40px;
}
.hidden{display:none!important}

/* ── HEADER ──────────────────────────────────────── */
.hdr{
  width:100%;max-width:900px;
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 0 18px;border-bottom:1px solid var(--border);margin-bottom:24px;
}
.hdr-left .sup{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.hdr-left h1{font-size:17px;font-weight:600}
.badge{
  background:var(--green-d);color:var(--green);font-size:10px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid var(--green);
}

/* ── LANGUAGE SCREEN ─────────────────────────────── */
#screen-lang{width:100%;max-width:900px;text-align:center;padding:40px 0 20px}
#screen-lang .icon{font-size:52px;margin-bottom:16px}
#screen-lang h2{font-size:26px;font-weight:700;margin-bottom:8px}
#screen-lang .sub{color:var(--dim);font-size:15px;margin-bottom:28px}
.lang-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;max-width:800px;margin:0 auto 32px;
}
.lang-btn{
  background:var(--surface);border:1.5px solid var(--border);border-radius:10px;
  padding:14px 12px;cursor:pointer;transition:all .15s;text-align:center;
}
.lang-btn:hover{border-color:var(--blue);background:var(--blue-d)}
.lang-btn .lf{font-size:26px;margin-bottom:6px}
.lang-btn .ln{font-size:14px;font-weight:600;color:var(--text)}
.lang-btn .le{font-size:11px;color:var(--dim);margin-top:2px}
.lang-btn.selected{border-color:var(--green);background:var(--green-d)}
.start-row{margin-top:8px}

/* ── PROGRESS ────────────────────────────────────── */
.prog-wrap{width:100%;max-width:900px;margin-bottom:20px}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
.prog-track{height:5px;background:var(--surface2);border-radius:5px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:5px;transition:width .5s ease}

/* ── CARD ────────────────────────────────────────── */
.card{
  width:100%;max-width:900px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:14px;
}

/* ── INCIDENT CARD ───────────────────────────────── */
.inc-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.inc-tag{
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--yellow);background:var(--yellow-d);padding:3px 9px;border-radius:4px;border:1px solid var(--yellow);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.inc-id{font-size:12px;color:var(--muted);font-family:monospace}
.inc-title{font-size:19px;font-weight:700;margin-bottom:12px}
.inc-body{
  background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  padding:14px 18px;font-size:14px;line-height:1.75;min-height:60px;
}
.inc-body .hl{color:var(--blue);font-weight:600}
/* typewriter cursor */
.cursor{display:inline-block;width:2px;height:1em;background:var(--blue);
  vertical-align:text-bottom;animation:blink .7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── QUESTION AREA ───────────────────────────────── */
.q-step{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.q-text{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:18px}

/* ── Q1: THREAT CLASSIFICATION ──────────────────── */
.threat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.threat-grid{grid-template-columns:1fr}}
.threat-card{
  background:var(--surface2);border:2px solid var(--border);border-radius:10px;
  padding:18px;cursor:pointer;transition:all .15s;text-align:center;
}
.threat-card:hover:not(.disabled){border-color:var(--blue);background:var(--blue-d)}
.threat-card .tc-icon{font-size:32px;margin-bottom:10px}
.threat-card .tc-name{font-size:15px;font-weight:700;margin-bottom:6px}
.threat-card .tc-sub{font-size:12px;color:var(--dim);line-height:1.5}
.threat-card.correct{border-color:var(--green);background:var(--green-d)}
.threat-card.incorrect{border-color:var(--red);background:var(--red-d)}
.threat-card.dimmed{opacity:.35}
.threat-card.disabled{cursor:default}

/* ── Q2: KILL CHAIN TIMELINE ─────────────────────── */
.evidence-card{
  background:var(--yellow-d);border:1px solid var(--yellow);border-radius:8px;
  padding:12px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;
}
.evidence-card .ev-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.evidence-card .ev-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--yellow);margin-bottom:3px}
.evidence-card .ev-text{font-size:13px;line-height:1.5;color:var(--text)}

.kc-timeline{
  display:flex;align-items:center;gap:0;flex-wrap:nowrap;overflow-x:auto;
  padding-bottom:4px;
}
.kc-stage{
  flex-shrink:0;background:var(--surface2);border:2px solid var(--border);
  border-radius:8px;padding:10px 8px;cursor:pointer;text-align:center;
  transition:all .15s;min-width:88px;
}
.kc-stage:hover:not(.disabled){border-color:var(--blue);background:var(--blue-d);transform:translateY(-2px)}
.kc-stage .ks-num{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:700}
.kc-stage .ks-name{font-size:11px;font-weight:700;line-height:1.3;color:var(--text)}
.kc-stage .ks-sub{font-size:10px;color:var(--dim);line-height:1.3;margin-top:2px}
.kc-arrow{flex-shrink:0;color:var(--muted);font-size:14px;padding:0 2px;line-height:1;align-self:center}
.kc-stage.correct{border-color:var(--green);background:var(--green-d)}
.kc-stage.incorrect{border-color:var(--red);background:var(--red-d)}
.kc-stage.dimmed{opacity:.3}
.kc-stage.disabled{cursor:default}
.kc-stage.selected-wrong{border-color:var(--red);background:var(--red-d)}

/* ── Q3: ACTOR CARDS ─────────────────────────────── */
.actor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.actor-grid{grid-template-columns:1fr}}
.actor-card{
  background:var(--surface2);border:2px solid var(--border);border-radius:10px;
  padding:16px;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:12px;
}
.actor-card:hover:not(.disabled){border-color:var(--purple);background:var(--purple-d)}
.actor-card .ac-icon{font-size:26px;flex-shrink:0;margin-top:2px}
.actor-card .ac-name{font-size:14px;font-weight:700;margin-bottom:4px}
.actor-card .ac-mot{font-size:11px;color:var(--dim);line-height:1.4}
.actor-card.correct{border-color:var(--green);background:var(--green-d)}
.actor-card.incorrect{border-color:var(--red);background:var(--red-d)}
.actor-card.dimmed{opacity:.35}
.actor-card.disabled{cursor:default}

/* ── FEEDBACK ─────────────────────────────────────── */
.feedback{
  margin-top:14px;border-radius:8px;padding:12px 16px;
  font-size:13px;line-height:1.6;display:none;
  animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.feedback.correct{background:var(--green-d);border:1px solid var(--green);color:#7ee787}
.feedback.incorrect{background:var(--red-d);border:1px solid var(--red);color:#ffa198}
.feedback strong{display:block;font-size:14px;margin-bottom:3px}

/* ── NAV ──────────────────────────────────────────── */
.nav-row{width:100%;max-width:900px;display:flex;justify-content:flex-end;margin-top:4px}
.btn{
  padding:10px 22px;border-radius:6px;font-size:14px;font-weight:600;
  cursor:pointer;border:none;transition:all .15s;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--dim)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-lg{padding:14px 36px;font-size:16px}

/* ── RESULTS ──────────────────────────────────────── */
#screen-results{width:100%;max-width:900px}
.results-top{text-align:center;padding:28px 0 20px}
.score-ring{
  width:110px;height:110px;border-radius:50%;
  border:4px solid var(--green);background:var(--green-d);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:0 auto 18px;
}
.score-ring .sr-n{font-size:34px;font-weight:700;color:var(--green);line-height:1}
.score-ring .sr-d{font-size:13px;color:var(--dim)}
.results-top h2{font-size:22px;font-weight:700;margin-bottom:6px}
.results-top p{color:var(--dim);font-size:14px}
.sc-block{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin-bottom:10px}
.sc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sc-hdr .sc-title{font-weight:600;font-size:14px}
.sc-tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.sc-tag.p{background:var(--green-d);color:var(--green);border:1px solid var(--green)}
.sc-tag.m{background:var(--yellow-d);color:var(--yellow);border:1px solid var(--yellow)}
.sc-tag.f{background:var(--red-d);color:var(--red);border:1px solid var(--red)}
.q-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:4px 0;border-top:1px solid var(--border)}
.q-row .q-ic{flex-shrink:0;margin-top:1px}
.q-row .q-lbl{color:var(--dim);flex:1}
.q-row .q-ans{font-weight:600}
.q-row.w .q-ans{color:var(--red)}
.q-row .q-fix{color:var(--green);font-size:11px}
.takeaways{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px 22px;margin-top:6px}
.takeaways h3{font-size:14px;font-weight:600;color:var(--blue);margin-bottom:12px}
.tk{display:flex;gap:10px;margin-bottom:8px;font-size:13px;line-height:1.5}
.tk .ti{flex-shrink:0}
.tk .tt{color:var(--dim)}
.tk .tt strong{color:var(--text)}
.results-foot{text-align:center;padding:24px 0 12px}

/* ── RTL OVERRIDES ────────────────────────────────── */
[dir=rtl] .hdr{flex-direction:row-reverse}
[dir=rtl] .kc-timeline{flex-direction:row-reverse}
[dir=rtl] .kc-arrow{transform:scaleX(-1)}
[dir=rtl] .evidence-card{flex-direction:row-reverse}
[dir=rtl] .actor-card{flex-direction:row-reverse}
[dir=rtl] .nav-row{justify-content:flex-start}
[dir=rtl] .prog-meta{flex-direction:row-reverse}
</style>
</head>

// ════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════
let selectedLang = 'en';
let L = LANG.en;
let scenarioIdx = 0, questionIdx = 0, score = 0, answered = false;
let results = [];
let typeTimer = null;

// ════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════
window.onload = function(){
  buildLangGrid();
};

function buildLangGrid(){
  const grid = document.getElementById('lang-grid');
  grid.innerHTML = '';
  Object.entries(LANG).forEach(([code, l])=>{
    const d = document.createElement('div');
    d.className = 'lang-btn' + (code===selectedLang?' selected':'');
    d.innerHTML = `<div class="lf">${l.flag}</div><div class="ln">${l.name}</div>`;
    d.onclick = ()=>{ selectedLang=code; L=LANG[code]; buildLangGrid(); applyLang(); };
    grid.appendChild(d);
  });
}

function applyLang(){
  document.documentElement.lang = selectedLang;
  document.documentElement.dir = L.dir;
  document.getElementById('hdr-title').textContent = L.title;
  document.getElementById('start-btn').textContent = L.begin;
}

function show(id){
  ['screen-lang','screen-game','screen-results'].forEach(s=>document.getElementById(s).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// ════════════════════════════════════════════════════
//  GAME START / SCENARIO LOAD
// ════════════════════════════════════════════════════
function startSim(){
  scenarioIdx=0; questionIdx=0; score=0; results=[];
  show('screen-game');
  loadScenario();
}

function loadScenario(){
  const sc = SCENARIOS[scenarioIdx];
  results.push({ title: sc.title, qs: [] });
  document.getElementById('inc-tag').textContent = L.incomingAlert;
  document.getElementById('inc-id').textContent = sc.id;
  document.getElementById('inc-title').textContent = sc.title;
  // typewriter reveal
  typewriterReveal(sc.body, 'inc-body', ()=>{ questionIdx=0; loadQuestion(); });
}

function typewriterReveal(html, targetId, done){
  const el = document.getElementById(targetId);
  // strip html tags to get plain text length, but render as html
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const plain = tmp.textContent;
  let i=0;
  el.innerHTML = '';
  clearInterval(typeTimer);
  const cursor = '<span class="cursor"></span>';
  typeTimer = setInterval(()=>{
    i++;
    // reveal character by character using a slice of the plain text
    // But we want to keep html markup — easier to just do a percentage reveal
    const pct = i/plain.length;
    const charCount = Math.floor(pct * plain.length);
    // We do this by fading in the full html all at once after a brief delay, actually:
    // simpler approach: just reveal word by word
    const words = plain.split(' ');
    const shown = words.slice(0, Math.floor(pct * words.length)).join(' ');
    if(i >= plain.length){
      clearInterval(typeTimer);
      el.innerHTML = html;
      if(done) setTimeout(done, 200);
    } else {
      el.innerHTML = shown + cursor;
    }
  }, 18);
}

function loadQuestion(){
  const sc = SCENARIOS[scenarioIdx];
  const q = sc.questions[questionIdx];
  answered = false;
  updateProgress();
  document.getElementById('q-step').textContent = L[q.step];
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('feedback').style.display='none';
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').classList.add('hidden');

  const area = document.getElementById('q-area');
  area.innerHTML = '';

  if(q.type==='threat') renderThreat(area,q);
  else if(q.type==='killchain') renderKillchain(area,q);
  else if(q.type==='actor') renderActor(area,q);

  // scroll question card into view
  setTimeout(()=>document.getElementById('q-card').scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}

// ── THREAT CLASSIFICATION ──
function renderThreat(area,q){
  const grid = document.createElement('div');
  grid.className = 'threat-grid';
  const items = [
    {icon:'🏗️', name:L.cyberThreat, sub:L.cyberThreatSub},
    {icon:'🎯', name:L.cyberEnabled, sub:L.cyberEnabledSub},
  ];
  items.forEach((item,i)=>{
    const c = document.createElement('div');
    c.className='threat-card';
    c.innerHTML=`<div class="tc-icon">${item.icon}</div><div class="tc-name">${item.name}</div><div class="tc-sub">${item.sub}</div>`;
    c.onclick=()=>selectAnswer(i,q,c,grid);
    grid.appendChild(c);
  });
  area.appendChild(grid);
}

// ── KILL CHAIN ──
function renderKillchain(area,q){
  // Evidence card
  const ev = document.createElement('div');
  ev.className='evidence-card';
  ev.innerHTML=`<div class="ev-icon">${q.evidenceIcon}</div><div><div class="ev-label">${L.evidence}</div><div class="ev-text">${q.evidenceText}</div></div>`;
  area.appendChild(ev);
  // Instruction
  const instr = document.createElement('div');
  instr.style.cssText='font-size:13px;color:var(--dim);margin-bottom:12px';
  instr.textContent = L.placeKC;
  area.appendChild(instr);
  // Timeline
  const tl = document.createElement('div');
  tl.className='kc-timeline';
  L.kc.forEach((name,i)=>{
    if(i>0){
      const arr = document.createElement('div');
      arr.className='kc-arrow';
      arr.textContent='›';
      tl.appendChild(arr);
    }
    const stage = document.createElement('div');
    stage.className='kc-stage';
    stage.innerHTML=`<div class="ks-num">${i+1}</div><div class="ks-name">${name}</div><div class="ks-sub">${L.kcSub[i]}</div>`;
    stage.onclick=()=>selectKCAnswer(i,q,stage,tl);
    tl.appendChild(stage);
  });
  area.appendChild(tl);
}

// ── ACTOR ──
function renderActor(area,q){
  const grid = document.createElement('div');
  grid.className='actor-grid';
  const actorDefs = [
    {key:'apt',icon:'🏛️'},{key:'crim',icon:'💰'},{key:'hack',icon:'📢'},{key:'ins',icon:'🔓'},
  ];
  actorDefs.forEach(({key,icon})=>{
    const a = L.actors[key];
    const c = document.createElement('div');
    c.className='actor-card';
    c.innerHTML=`<div class="ac-icon">${icon}</div><div><div class="ac-name">${a.name}</div><div class="ac-mot">${a.mot}</div></div>`;
    c.onclick=()=>selectActorAnswer(key,q,c,grid);
    grid.appendChild(c);
  });
  area.appendChild(grid);
}

// ════════════════════════════════════════════════════
//  ANSWER SELECTION
// ════════════════════════════════════════════════════
function selectAnswer(idx,q,clickedEl,container){
  if(answered) return;
  answered = true;
  const isCorrect = idx===q.answer;
  if(isCorrect) score++;
  recordResult(q,isCorrect, idx===0? L.cyberThreat:L.cyberEnabled, q.answer===0?L.cyberThreat:L.cyberEnabled);
  Array.from(container.children).forEach((c,i)=>{
    c.classList.add('disabled');
    if(i===q.answer) c.classList.add('correct');
    else if(i===idx && !isCorrect) c.classList.add('incorrect');
    else c.classList.add('dimmed');
  });
  showFeedback(isCorrect,q);
}

function selectKCAnswer(idx,q,clickedStage,timeline){
  if(answered) return;
  answered = true;
  const isCorrect = idx===q.answer;
  if(isCorrect) score++;
  const stages = timeline.querySelectorAll('.kc-stage');
  stages.forEach((s,i)=>{
    s.classList.add('disabled');
    if(i===q.answer) s.classList.add('correct');
    else if(i===idx && !isCorrect) s.classList.add('selected-wrong');
    else s.classList.add('dimmed');
  });
  recordResult(q,isCorrect, L.kc[idx], L.kc[q.answer]);
  showFeedback(isCorrect,q);
}

function selectActorAnswer(key,q,clickedCard,grid){
  if(answered) return;
  answered = true;
  const isCorrect = key===q.answer;
  if(isCorrect) score++;
  Array.from(grid.children).forEach((c,i)=>{
    const k = ['apt','crim','hack','ins'][i];
    c.classList.add('disabled');
    if(k===q.answer) c.classList.add('correct');
    else if(k===key && !isCorrect) c.classList.add('incorrect');
    else c.classList.add('dimmed');
  });
  recordResult(q,isCorrect, L.actors[key].name, L.actors[q.answer].name);
  showFeedback(isCorrect,q);
}

function recordResult(q,isCorrect,selectedText,correctText){
  results[scenarioIdx].qs.push({step:L[q.step], correct:isCorrect, sel:selectedText, cor:correctText});
}

function showFeedback(isCorrect,q){
  const fb = document.getElementById('feedback');
  fb.className = 'feedback '+(isCorrect?'correct':'incorrect');
  fb.innerHTML = `<strong>${isCorrect?L.correct:L.incorrect}</strong>${isCorrect?q.fc:q.fw}`;
  fb.style.display='block';
  updateProgress();
  const btn = document.getElementById('next-btn');
  btn.classList.remove('hidden');
  const sc = SCENARIOS[scenarioIdx];
  const lastQ = questionIdx===sc.questions.length-1;
  const lastS = scenarioIdx===SCENARIOS.length-1;
  btn.textContent = (lastQ&&lastS)?L.viewResults : lastQ?L.nextIncident : L.continue;
}

// ════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════
function nextStep(){
  const sc = SCENARIOS[scenarioIdx];
  const lastQ = questionIdx===sc.questions.length-1;
  const lastS = scenarioIdx===SCENARIOS.length-1;
  if(lastQ&&lastS){ showResults(); return; }
  if(lastQ){ scenarioIdx++; loadScenario(); }
  else{ questionIdx++; loadQuestion(); }
}

function updateProgress(){
  const total = SCENARIOS.reduce((a,s)=>a+s.questions.length,0);
  const done = results.reduce((a,s)=>a+s.qs.length,0);
  const pct = Math.round(done/total*100);
  document.getElementById('prog-label').textContent = `${L.incident} ${scenarioIdx+1} ${L.of} ${SCENARIOS.length}`;
  document.getElementById('prog-score').textContent = `${L.score}: ${score} / ${total}`;
  document.getElementById('prog-fill').style.width = pct+'%';
}

// ════════════════════════════════════════════════════
//  RESULTS
// ════════════════════════════════════════════════════
function showResults(){
  clearInterval(typeTimer);
  const total = SCENARIOS.reduce((a,s)=>a+s.questions.length,0);
  const pct = Math.round(score/total*100);
  document.getElementById('res-score').textContent = score;
  document.getElementById('res-denom').textContent = '/ '+total;
  let t,s;
  if(pct>=90){t=L.outstanding;s=L.outstanding_sub;}
  else if(pct>=70){t=L.solid;s=L.solid_sub;}
  else if(pct>=50){t=L.developing;s=L.developing_sub;}
  else{t=L.debrief;s=L.debrief_sub;}
  document.getElementById('res-title').textContent=t;
  document.getElementById('res-sub').textContent=s;

  const bd = document.getElementById('res-breakdown');
  bd.innerHTML='';
  results.forEach((r,si)=>{
    const cor = r.qs.filter(q=>q.correct).length;
    const tot = r.qs.length;
    const cls = cor===tot?'p':cor>=tot/2?'m':'f';
    const b = document.createElement('div');
    b.className='sc-block';
    let rows = r.qs.map(q=>{
      const wc = q.correct?'':'w';
      const fix = q.correct?'':` <span class="q-fix">→ ${q.cor}</span>`;
      return `<div class="q-row ${wc}">
        <span class="q-ic" style="color:${q.correct?'var(--green)':'var(--red)'}">${q.correct?'✓':'✗'}</span>
        <span class="q-lbl">${q.step.split('—')[1]?.trim()||q.step}</span>
        <span class="q-ans">${q.sel}${fix}</span>
      </div>`;
    }).join('');
    b.innerHTML=`<div class="sc-hdr"><span class="sc-title">${SCENARIOS[si].id} — ${r.title}</span><span class="sc-tag ${cls}">${cor}/${tot}</span></div>${rows}`;
    bd.appendChild(b);
  });

  // Takeaways
  const tw = document.getElementById('takeaways-block');
  tw.innerHTML=`<h3>${L.keyTakeaways}</h3>
    ${['🔵','🟡','🟢','🔴'].map((ic,i)=>`<div class="tk"><div class="ti">${ic}</div><div class="tt">${L['tk'+(i+1)]}</div></div>`).join('')}`;
  document.getElementById('restart-btn').textContent=L.restart;
  show('screen-results');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
